<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#243a46" />
<title>Bath Manager Dashboard</title>
<style>
:root{
 --navy:#243a46; --navy2:#314f5e; --teal:#2fb89d; --teal2:#dff6f0;
 --bg:#f4f7f8; --card:#ffffff; --text:#24343d; --muted:#6f8089; --line:#dbe4e8;
 --good:#198754; --goodbg:#e9f6ef; --warn:#a66b00; --warnbg:#fff6df; --bad:#b4232f; --badbg:#fdebed;
 --info:#2d6c88; --infobg:#eaf4f9; --shadow:0 8px 26px rgba(28,52,64,.08);
 --radius:16px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{min-height:100vh;display:flex}
.sidebar{width:240px;background:linear-gradient(180deg,var(--navy),#1e323c);color:#fff;position:fixed;inset:0 auto 0 0;padding:22px 14px;display:flex;flex-direction:column;z-index:20}
.brand{padding:0 12px 20px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:12px}
.brand small{display:block;color:#a8c4cf;text-transform:uppercase;letter-spacing:.14em;font-size:10px;font-weight:800}.brand strong{display:block;font-size:20px;margin-top:6px;letter-spacing:-.02em}.brand span{font-size:12px;color:#c5d6dc}
.nav{display:flex;flex-direction:column;gap:4px;overflow:auto;padding:4px 0 16px}.nav button{border:0;background:transparent;color:#dce8ec;text-align:left;border-radius:11px;padding:11px 12px;display:flex;align-items:center;gap:10px;font-weight:650;font-size:13px}.nav button:hover{background:rgba(255,255,255,.08)}.nav button.active{background:rgba(47,184,157,.18);color:#fff;box-shadow:inset 3px 0 0 var(--teal)}.nav-icon{width:25px;height:25px;border-radius:8px;background:rgba(255,255,255,.09);display:grid;place-items:center;font-size:12px;font-weight:900}.nav button.active .nav-icon{background:var(--teal);color:#14352e}
.sidebar-foot{margin-top:auto;padding:12px;color:#abc0c9;font-size:11px;line-height:1.4}.sidebar-foot b{color:#fff}
.main{margin-left:240px;min-width:0;width:calc(100% - 240px)}
.topbar{height:70px;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:15;display:flex;align-items:center;justify-content:space-between;padding:0 26px}.topbar h1{font-size:18px;margin:0;letter-spacing:-.02em}.topbar .subtitle{font-size:12px;color:var(--muted);margin-top:2px}.top-actions{display:flex;gap:9px;align-items:center}.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:7px 10px;background:#f0f5f6;color:#53656f;font-size:11px;font-weight:700}.dot{width:8px;height:8px;border-radius:50%;background:var(--teal)}
.content{padding:24px 26px 48px;max-width:1540px;margin:0 auto}.view{display:none}.view.active{display:block}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:20px}.page-head h2{font-size:25px;margin:0 0 5px;letter-spacing:-.035em}.page-head p{margin:0;color:var(--muted);font-size:13px;max-width:800px;line-height:1.55}.page-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:10px;padding:9px 12px;font-weight:750;font-size:12px;box-shadow:0 1px 1px rgba(0,0,0,.02)}.btn:hover{border-color:#b9c9d0;background:#fbfdfd}.btn.primary{background:var(--teal);border-color:var(--teal);color:#0a332a}.btn.dark{background:var(--navy);border-color:var(--navy);color:#fff}.btn.danger{background:#fff;border-color:#efc6ca;color:var(--bad)}.btn.small{padding:6px 9px;font-size:11px}.btn:disabled{opacity:.45;cursor:not-allowed}
.grid{display:grid;gap:14px}.grid.kpi{grid-template-columns:repeat(4,minmax(0,1fr))}.grid.two{grid-template-columns:1.35fr .65fr}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.grid.attention{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:17px}.card.flush{padding:0;overflow:hidden}.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.card-title{font-size:13px;font-weight:850;letter-spacing:-.01em}.card-sub{color:var(--muted);font-size:11px}.kpi-card{min-height:118px;position:relative;overflow:hidden}.kpi-card:after{content:"";position:absolute;width:80px;height:80px;border-radius:50%;right:-22px;top:-25px;background:rgba(47,184,157,.08)}.kpi-label{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:850}.kpi-value{font-size:27px;font-weight:850;letter-spacing:-.04em;margin:8px 0 4px}.kpi-meta{font-size:11px;color:var(--muted)}
.attn-card{padding:0;overflow:hidden;transition:.16s transform,.16s box-shadow;cursor:pointer}.attn-card:hover{transform:translateY(-1px);box-shadow:0 10px 30px rgba(28,52,64,.12)}.attn-top{height:5px;background:var(--teal)}.attn-card.warn .attn-top{background:#e7a62e}.attn-card.bad .attn-top{background:#d95863}.attn-body{padding:16px}.attn-title{display:flex;justify-content:space-between;gap:8px;align-items:center;font-weight:850;font-size:13px}.attn-num{font-size:24px;font-weight:850;letter-spacing:-.04em;margin:10px 0 2px}.attn-text{font-size:12px;color:var(--muted);line-height:1.5}.status{display:inline-flex;align-items:center;border-radius:999px;padding:4px 8px;font-size:10px;font-weight:850;white-space:nowrap}.status.good{background:var(--goodbg);color:var(--good)}.status.warn{background:var(--warnbg);color:var(--warn)}.status.bad{background:var(--badbg);color:var(--bad)}.status.info{background:var(--infobg);color:var(--info)}.status.gray{background:#edf1f3;color:#63747c}
.section-title{font-size:13px;font-weight:850;margin:22px 0 10px}.section-note{font-size:11px;color:var(--muted);margin-top:-6px;margin-bottom:10px}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:13px;background:#fff}.table{width:100%;border-collapse:collapse;font-size:11px;min-width:720px}.table th{position:sticky;top:0;background:#f3f7f8;color:#5d6e77;text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);font-size:9px;text-transform:uppercase;letter-spacing:.07em;white-space:nowrap;z-index:1}.table td{padding:9px 10px;border-bottom:1px solid #eef2f4;vertical-align:middle}.table tr:last-child td{border-bottom:0}.table tr:hover td{background:#fbfdfd}.money{font-variant-numeric:tabular-nums;font-weight:700}.muted{color:var(--muted)}.right{text-align:right}.center{text-align:center}.nowrap{white-space:nowrap}.strong{font-weight:800}
.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:10px;font-weight:800;color:#61727b;text-transform:uppercase;letter-spacing:.05em}.input,.select,.textarea{width:100%;border:1px solid #ccd8dd;background:#fff;border-radius:10px;padding:9px 10px;color:var(--text);outline:none}.input:focus,.select:focus,.textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(47,184,157,.12)}.textarea{min-height:78px;resize:vertical}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.form-grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.form-grid.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow:auto}.tab{border:0;background:transparent;padding:10px 11px;margin-bottom:-1px;border-bottom:2px solid transparent;color:var(--muted);font-size:12px;font-weight:800;white-space:nowrap}.tab.active{border-bottom-color:var(--teal);color:var(--text)}
.dropzone{border:1.5px dashed #a9bcc5;background:#fafdfe;border-radius:15px;padding:30px 18px;text-align:center;transition:.15s}.dropzone.drag{border-color:var(--teal);background:#f1fbf8}.dropzone strong{font-size:14px}.dropzone p{margin:6px 0 13px;color:var(--muted);font-size:11px}.hidden-input{display:none}
.report-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.report-card{border:1px solid var(--line);border-radius:13px;padding:13px;background:#fff}.report-title{font-size:12px;font-weight:850}.report-feeds{font-size:10px;color:var(--muted);margin:5px 0 9px;line-height:1.45}.fresh{font-size:10px;font-weight:800}.fresh.ok{color:var(--good)}.fresh.stale{color:var(--warn)}.fresh.missing{color:var(--bad)}
.bar-row{display:grid;grid-template-columns:140px 1fr 70px;gap:10px;align-items:center;margin:8px 0;font-size:10px}.bar-bg{height:8px;background:#edf2f4;border-radius:99px;overflow:hidden}.bar-fill{height:100%;background:var(--teal);border-radius:99px}.bar-fill.bad{background:#d95863}.bar-fill.warn{background:#e7a62e}
.empty{border:1px dashed #c6d3d8;background:#fbfdfd;border-radius:14px;padding:30px;text-align:center}.empty h3{margin:0 0 6px;font-size:15px}.empty p{color:var(--muted);font-size:11px;max-width:560px;margin:0 auto 13px;line-height:1.5}
.rule-box{background:#f8fbfc;border:1px solid var(--line);border-radius:13px;padding:13px;font-size:11px;line-height:1.55;color:#4e6069}.rule-box b{color:var(--text)}
.alert{border-radius:12px;padding:11px 12px;font-size:11px;line-height:1.45;margin-bottom:12px}.alert.warn{background:var(--warnbg);color:#805500;border:1px solid #f1dca8}.alert.info{background:var(--infobg);color:#285e76;border:1px solid #cce4ee}.alert.bad{background:var(--badbg);color:#8e1f29;border:1px solid #f2cbd0}
.action-banner{border:1px solid #efc6ca;background:linear-gradient(135deg,#fff7f8,#fdebed);border-radius:16px;padding:15px 16px;margin:0 0 16px;display:flex;align-items:center;justify-content:space-between;gap:14px;box-shadow:var(--shadow)}
.action-banner.warn{border-color:#f0d9a4;background:linear-gradient(135deg,#fffaf0,#fff3d6)}
.action-banner .action-copy{min-width:0}.action-banner .action-title{font-size:13px;font-weight:900;color:var(--bad);margin-bottom:5px}.action-banner.warn .action-title{color:var(--warn)}.action-banner .action-detail{font-size:11px;color:#6a5960;line-height:1.5}.action-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.employee-tools{display:flex;gap:8px;align-items:end;flex-wrap:wrap;margin:12px 0}.employee-tools .field{min-width:165px}.employee-row-action td{background:#fff8f8}.employee-row-watch td{background:#fffdf4}.employee-name{display:flex;flex-direction:column;gap:2px}.employee-name small{color:var(--muted);font-size:9px}.profile-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:12px 0}.profile-stat{border:1px solid var(--line);border-radius:12px;padding:10px;background:#fafcfd}.profile-stat .label{font-size:9px;color:var(--muted);font-weight:850;text-transform:uppercase;letter-spacing:.06em}.profile-stat .value{font-size:14px;font-weight:850;margin-top:4px}.subtle-link{border:0;background:transparent;padding:0;color:var(--info);font-size:10px;font-weight:800;text-decoration:underline;text-underline-offset:2px}

.modal-backdrop{position:fixed;inset:0;background:rgba(18,34,42,.46);display:none;align-items:center;justify-content:center;padding:18px;z-index:100}.modal-backdrop.open{display:flex}.modal{width:min(660px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:18px;box-shadow:0 24px 70px rgba(0,0,0,.24);border:1px solid #cbd8dd}.modal-head{padding:17px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.modal-head h3{margin:0;font-size:16px}.modal-body{padding:18px}.modal-foot{padding:13px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}.close-x{border:0;background:#f1f5f6;border-radius:9px;width:30px;height:30px;font-size:16px}
.toast{position:fixed;right:20px;bottom:20px;background:#213640;color:#fff;padding:11px 14px;border-radius:11px;font-size:11px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.2);opacity:0;transform:translateY(10px);pointer-events:none;transition:.2s;z-index:150}.toast.show{opacity:1;transform:none}
.review-item{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;border:1px solid var(--line);padding:11px;border-radius:11px;margin:8px 0}.review-item .meta{font-size:10px;color:var(--muted);margin-top:3px}
.mobile-menu{display:none;border:0;background:#edf3f5;border-radius:9px;padding:8px 10px;font-weight:800}

.home-core{grid-template-columns:repeat(3,minmax(0,1fr))}
.action-center{display:flex;flex-direction:column;gap:8px}
.action-row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff}
.action-row.bad{border-color:#efc6ca;background:#fff9fa}.action-row.warn{border-color:#f0d9a4;background:#fffdf7}.action-row.info{border-color:#cce4ee;background:#fbfeff}
.action-dot{width:9px;height:9px;border-radius:50%;background:var(--teal)}.action-row.bad .action-dot{background:#d95863}.action-row.warn .action-dot{background:#e7a62e}.action-row.info .action-dot{background:#5aa7c8}
.action-row-title{font-size:12px;font-weight:850}.action-row-detail{font-size:10.5px;color:var(--muted);margin-top:3px;line-height:1.4}
.health-strip{display:flex;gap:7px;flex-wrap:wrap;align-items:center}.health-chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 10px;font-size:10px;font-weight:800;color:#52646d}
.health-chip.good{border-color:#cce8d8;background:var(--goodbg);color:var(--good)}.health-chip.warn{border-color:#f0d9a4;background:var(--warnbg);color:var(--warn)}.health-chip.bad{border-color:#efc6ca;background:var(--badbg);color:var(--bad)}
.coverage-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.coverage-card{border:1px solid var(--line);border-radius:13px;background:#fff;padding:12px}
.coverage-head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.coverage-name{font-size:11.5px;font-weight:850}.coverage-meta{font-size:10px;color:var(--muted);margin-top:5px;line-height:1.45}
.coverage-track{height:8px;background:#edf2f4;border-radius:999px;position:relative;overflow:hidden;margin-top:10px}.coverage-range{position:absolute;top:0;bottom:0;background:var(--teal);border-radius:999px;min-width:4px}.coverage-range.warn{background:#e7a62e}.coverage-range.bad{background:#d95863}.coverage-range.info{background:#5aa7c8}
.coverage-axis{display:flex;justify-content:space-between;font-size:8.5px;color:#89979e;margin-top:4px}
.cleanup-list{display:flex;flex-direction:column;gap:7px}.cleanup-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border-bottom:1px solid #eef2f4;padding:8px 0}.cleanup-row:last-child{border-bottom:0}.cleanup-title{font-size:11px;font-weight:850}.cleanup-detail{font-size:10px;color:var(--muted);margin-top:2px}
.diag-table{display:flex;flex-direction:column;gap:7px}.diag-row{display:grid;grid-template-columns:85px 1fr;gap:10px;align-items:start;border:1px solid var(--line);border-radius:12px;padding:10px 11px;background:#fff}.diag-title{font-size:11px;font-weight:850}.diag-detail{font-size:10px;color:var(--muted);margin-top:3px;line-height:1.45}

.sch-rank{font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:.04em;border-radius:999px;padding:5px 8px;display:inline-flex;align-items:center;white-space:nowrap}
.sch-rank.high{background:var(--goodbg);color:var(--good)}.sch-rank.possible{background:var(--warnbg);color:var(--warn)}.sch-rank.low{background:#eef2f4;color:#5b6b72}.sch-rank.hold{background:var(--badbg);color:var(--bad)}
.sch-signal{border:1px solid var(--line);border-radius:12px;padding:10px 11px;background:#fff}.sch-signal+.sch-signal{margin-top:8px}
.sch-evidence{font-size:10px;color:var(--muted);line-height:1.45;margin-top:4px}.sch-why{font-size:11px;font-weight:800;line-height:1.45}
.sch-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.sch-source{border:1px solid var(--line);border-radius:12px;padding:11px;background:#fff}
.sch-source .big{font-size:16px;font-weight:900;margin-top:3px}.sch-source .small{font-size:9px;color:var(--muted);line-height:1.4;margin-top:4px}
.sch-match{font-size:9.5px;line-height:1.45}.sch-match b{font-size:10.5px}.sch-section{margin-top:14px}
.sch-code{font-weight:900;font-size:12px}.sch-code.n{color:var(--good)}.sch-code.f{color:#236ea4}.sch-code.rf,.sch-code.y{color:var(--bad)}.sch-code.unknown{color:var(--muted)}
.sch-note-box{background:#f7fafb;border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:10px;line-height:1.45;white-space:pre-wrap}

.sch-status-select{min-width:165px;font-size:10px;font-weight:800;padding:7px 8px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--text)}
.sch-status-select.left-message{background:#fff8e7;border-color:#efd38c}.sch-status-select.waiting-material{background:#eef8fb;border-color:#b8dce9}.sch-status-select.scheduled{background:var(--goodbg);border-color:#b9dfc9;color:var(--good)}.sch-status-select.cant-move{background:var(--badbg);border-color:#ecc4c8;color:var(--bad)}
.sch-track-note{font-size:8.5px;color:var(--muted);margin-top:4px;line-height:1.35}
@media(max-width:1100px){.sch-grid{grid-template-columns:1fr}}
@media(max-width:1050px){.home-core,.coverage-grid{grid-template-columns:1fr}.action-row{grid-template-columns:auto 1fr}.action-row .btn{grid-column:2}}
@media(max-width:1100px){.grid.attention{grid-template-columns:repeat(2,1fr)}.grid.kpi{grid-template-columns:repeat(2,1fr)}.grid.two{grid-template-columns:1fr}.report-grid{grid-template-columns:1fr}.form-grid.four{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){.sidebar{transform:translateX(-101%);transition:.2s;width:250px}.sidebar.open{transform:none}.main{margin-left:0;width:100%}.mobile-menu{display:inline-block}.topbar{padding:0 14px;height:62px}.content{padding:16px 13px 38px}.top-actions .pill{display:none}.page-head{align-items:flex-start;flex-direction:column}.grid.attention,.grid.kpi,.grid.three{grid-template-columns:1fr}.form-grid,.form-grid.three,.form-grid.four{grid-template-columns:1fr}.bar-row{grid-template-columns:100px 1fr 55px}.card{padding:14px}.page-head h2{font-size:22px}}

.employment-timeline{display:flex;flex-direction:column;gap:8px;margin-top:10px}.history-card{border:1px solid var(--line);border-radius:12px;padding:10px;background:#fff}.history-card .history-top{display:flex;justify-content:space-between;gap:8px;align-items:center}.history-card .history-title{font-weight:900;font-size:11px;color:var(--text)}.history-card .history-meta{font-size:9px;color:var(--muted);margin-top:4px;line-height:1.45}.history-card.future{border-color:#9fd7ee;background:#f5fbfe}.export-note{font-size:9px;color:var(--muted);margin-top:6px}.mini-pay{font-size:9px;color:var(--muted);margin-top:2px}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
 <div class="brand"><small>PJ Fitzpatrick</small><strong>Bath Manager</strong><span>Operating Dashboard</span></div>
 <nav class="nav" id="nav"></nav>
 <div class="sidebar-foot"><b>Local-first build • v0.42 (capacity estimate labels)</b><br>Data saves in this browser. Use Audit → Backup before moving devices.</div>
</aside>
<main class="main">
 <header class="topbar">
  <div style="display:flex;align-items:center;gap:10px"><button class="mobile-menu" id="mobileMenu">Menu</button><div><h1 id="topTitle">Home</h1><div class="subtitle" id="topSubtitle">What needs your attention</div></div></div>
  <div class="top-actions"><span class="pill"><span class="dot"></span><span id="saveStateText">Saved locally</span></span><button class="btn small" id="globalBackup">Backup</button></div>
 </header>
 <div class="content">
  <section class="view active" id="view-home"></section>
  <section class="view" id="view-imports"></section>
  <section class="view" id="view-daily"></section>
  <section class="view" id="view-capacity"></section>
  <section class="view" id="view-scheduling"></section>
  <section class="view" id="view-payroll"></section>
  <section class="view" id="view-surveys"></section>
  <section class="view" id="view-wbr"></section>
  <section class="view" id="view-ar"></section>
  <section class="view" id="view-req"></section>
  <section class="view" id="view-audit"></section>
  <section class="view" id="view-callouts"></section>
 </div>
</main>
</div>
<div class="modal-backdrop" id="modal"><div class="modal"><div class="modal-head"><h3 id="modalTitle"></h3><button class="close-x" id="modalClose">×</button></div><div class="modal-body" id="modalBody"></div><div class="modal-foot" id="modalFoot"></div></div></div>

function employeeChangeType(before,after){
 const roleChanged=String(before.role||'')!==String(after.role||'');
 const teamChanged=String(before.team||'')!==String(after.team||'');
 const commissionChanged=String(before.commissionRate??'')!==String(after.commissionRate??'');
 const hourlyChanged=String(before.hourlyRate??'')!==String(after.hourlyRate??'');
 const payChanged=commissionChanged||hourlyChanged;
 const rank={Apprentice:1,Journeyman:2,Lead:3,'Master Lead':4,Manager:5};
 if(roleChanged&&payChanged)return (rank[after.role]||0)>(rank[before.role]||0)?'Promotion / Pay Change':'Role / Pay Change';
 if(roleChanged)return (rank[after.role]||0)>(rank[before.role]||0)?'Promotion':'Role Change';
 if(payChanged&&teamChanged)return'Pay / Team Change';
 if(payChanged)return'Pay Change';
 if(teamChanged)return'Team Change';
 return'Employee Update';
}

  if(e&&newPosition!==selectedPosition&&!exitPosition&&(newCommission===''||newHourly==='')){
   toast('A position change requires a new commission rate, new hourly rate, and effective date. Enter 0 for commission if the new position has no commission.');return;
  }

  if(!e){
   if(state.employees.some(x=>x.name.toLowerCase()===name.toLowerCase())){toast('Employee already exists');return}
   const newEmp={
    id:uid('emp'),name,role:newPosition,team:newTeam,hireDate:hire,terminationDate:'',discardDate:'',
    commissionRate:newCommission,hourlyRate:newHourly,status:'Active',ptoExhaustedDate:'',notes,
    employmentHistory:[{
     id:uid('hist'),effectiveDate:hire,type:'Hire / Initial Profile',role:newPosition,team:newTeam,

    }]
   };
   state.employees.push(newEmp);
   if(seedData.sourceName){

    if(source.toLowerCase()!==name.toLowerCase())state.employeeAliases[source.toLowerCase()]=name;
   }
   audit('Employee added',name,`${newPosition} • hire date ${hire}${seedData.reviewId?' • added from reporting review':''}`);
   refreshPayrollLeaveLinks();refreshPayrollRosterReview();rebuildCapacityCrewHistory();
   closeModal();saveSoon();payrollTab='employees';employeeRosterFilter='active';renderPayroll();return;
  }

  const oldHire=e.hireDate,existingTermination=e.terminationDate||'',existingDiscard=e.discardDate||'';
  e.hireDate=hire;
  e.notes=notes;

  const hist=employmentHistory(e),hireRec=hist.find(h=>h.type==='Hire / Initial Profile')||hist[0];
  if(hireRec&&oldHire!==hire)hireRec.effectiveDate=hire;

  if(newPosition==='Terminated'){
   const before=employeeSnapshot(e,addDaysISO(effectiveDate,-1));
   e.terminationDate=effectiveDate;e.discardDate='';
   e.status=effectiveDate<=asOf()?'Inactive':'Active';

   e.employmentHistory=(e.employmentHistory||[]).filter(h=>!['Termination','Discard Employee'].includes(h.type));
   e.employmentHistory.push({
    id:uid('hist'),effectiveDate,type:'Termination',role:'Terminated',
    team:newTeam!==''?newTeam:(before.team??''),
    commissionRate:newCommission!==''?newCommission:(before.commissionRate??''),
    hourlyRate:newHourly!==''?newHourly:(before.hourlyRate??''),
    notes:notes||`Termination effective ${effectiveDate}. Employee retained for historical/final payroll processing.`
   });

   audit('Employee terminated',e.name,`effective ${effectiveDate} • retained for historical/final payroll processing`);
  }else if(newPosition==='Discard Employee'){
   const before=employeeSnapshot(e,addDaysISO(effectiveDate,-1));
   e.discardDate=effectiveDate;e.terminationDate='';
   e.status=effectiveDate<=asOf()?'Discarded':'Active';
   e.employmentHistory=(e.employmentHistory||[]).filter(h=>!['Termination','Discard Employee'].includes(h.type));
   e.employmentHistory.push({
    id:uid('hist'),effectiveDate,type:'Discard Employee',role:'Discarded',
    team:before.team??newTeam??'',commissionRate:before.commissionRate??newCommission??'',
    hourlyRate:before.hourlyRate??newHourly??'',
    notes:notes||`Discarded from Bath reporting effective ${effectiveDate}. Record retained for audit/history.`
   });
   audit('Employee discarded from reporting',e.name,`effective ${effectiveDate} • excluded from Bath reporting`);
  }else{
   const existingExit=existingDiscard||existingTermination;
   if(existingExit&&effectiveDate>=existingExit){
    toast(`This employee is ${existingDiscard?'discarded':'terminated'} effective ${fmtDate(existingExit)}. For a correction, use an effective date before that date.`);return;
   }

   const before=employeeSnapshot(e,addDaysISO(effectiveDate,-1));
   const after={role:newPosition,team:newTeam,commissionRate:newCommission,hourlyRate:newHourly};
   const changed=String(before.role||'')!==String(after.role||'')||
    String(before.team||'')!==String(after.team||'')||
    String(before.commissionRate??'')!==String(after.commissionRate??'')||
    String(before.hourlyRate??'')!==String(after.hourlyRate??'');

   if(changed){
    const type=employeeChangeType(before,after);
    e.employmentHistory=e.employmentHistory||[];
    e.employmentHistory.push({
     id:uid('hist'),effectiveDate,type,role:newPosition,team:newTeam,
     commissionRate:newCommission,hourlyRate:newHourly,notes
    });
    audit('Employee profile changed',e.name,`${effectiveDate} • ${type} • ${newPosition}${newCommission!==''?' • '+newCommission+'%':''}${newHourly!==''?' • $'+newHourly+'/hr':''}`);
   }else{
    audit('Employee updated',e.name,`hire date / notes updated`);
   }

   // Preserve a future/existing exit when making a correction before it.
   e.status=existingDiscard&&existingDiscard<=asOf()?'Discarded':existingTermination&&existingTermination<=asOf()?'Inactive':'Active';
  }

  syncEmployeeCurrentFields(e);
  rebuildCapacityCrewHistory();
  closeModal();saveSoon();payrollTab='employees';employeeRosterFilter=employeeActiveOn(e,asOf())?'active':employmentStatusAt(e)==='Discarded'?'discarded':'terminated';renderPayroll();
 };

 const ensure=job=>{let x=byJob.get(job.jobNumber);if(!x){x={job,score:0,reasons:[],permit:null,material:null,scheduled:null,manual:null,blockers:[]};byJob.set(job.jobNumber,x)}return x};
 for(const job of jobs){
  if(/^Ready\s*-\s*Awaiting Permit$/i.test(job.status)){
   const p=permitAnalysisForJob(job);permitReviews.push(p);
   const x=ensure(job);x.permit=p;x.blockers=schedulingBlockers(job,p);
   if(p.ready){
    x.score+=p.mismatch||p.ambiguous?4:(p.applicable==='N'?7:6);
    x.reasons.push(`Permit tracker ${p.applicable}: ${p.reason}${p.current?` Current tag = ${p.current}.`:' Current permit tag missing.'}`);
   }
  }
  if(/^Ordered(?:\s*-\s*Awaiting ETA)?$/i.test(job.status)){
   const m=materialAnalysisForJob(job);materialReviews.push(m);
   if(m.status!=='none'){
    const x=ensure(job),p=permitAnalysisForJob(job);x.material=m;x.permit=x.permit||p;x.blockers=[...new Set([...x.blockers,...schedulingBlockers(job,p)])];
    if(m.status==='exact'){x.score+=7;x.reasons.push(`Matches dead stock exactly: ${m.exact[0].stockEvidence}. ${m.exact[0].evidence}`)}
    else if(m.potential[0]?.nearSizePan){x.score+=4;x.reasons.push(`Manager review — dead-stock pan is within 2" of requested size: ${m.potential[0].stockEvidence}. ${m.potential[0].evidence}`)}
    else if(m.potential[0]?.nearDrainPan){x.score+=4;x.reasons.push(`Manager review — exact-size pan has an acceptable center drain relocation: ${m.potential[0].stockEvidence}. ${m.potential[0].evidence}`)}
    else{x.score+=3;x.reasons.push(`Potential dead-stock match: ${m.potential[0].stockEvidence}. ${m.potential[0].evidence}`)}
   }
  }
  if(/^Scheduled$/i.test(job.status)){
   const sm=scheduledMoveUpAnalysis(job);scheduledReviews.push(sm);
   if(!sm.doNotPursue){
    const x=ensure(job),p=permitAnalysisForJob(job);x.scheduled=sm;x.permit=x.permit||p;x.blockers=[...new Set([...x.blockers,...schedulingBlockers(job,p)])];
    x.score+=sm.score;x.reasons.push(sm.positive?`Customer notes show a quicker-install signal: ${sm.evidence}`:sm.limited?`Customer has a scheduling preference/limitation but may accept another earlier opening: ${sm.evidence}`:'No explicit customer restriction was found in the current Summary/Job Notes; worth a low-priority move-up call.');
   }
  }
 }
 for(const m of state.moveUps||[]){
  const job=jobs.find(j=>j.jobNumber===String(m.jobNumber));if(!job)continue;const x=ensure(job);x.manual=m;x.score+=8;x.reasons.push(`Manual move-up record: available from ${fmtDate(m.availableDate)}${m.notes?` • ${m.notes}`:''}`);
 }
 const allOpportunities=[...byJob.values()].filter(x=>x.reasons.length).map(x=>{
  const hardHold=x.blockers.some(b=>/^RF permit|Permit requirement|ZIP has multiple|Electrical|PII|VA|Production hold/i.test(b));
  let likelihood=hardHold?'Least likely but worth a shot':x.score>=6?'Highly likely':x.score>=3?'Possibility':'Least likely but worth a shot';
  const trackingStatus=schedulingFollowupStatus(x.job.jobNumber);
  return{...x,hardHold,likelihood,trackingStatus,trackingClosed:schedulingFollowupClosed(x.job.jobNumber)};
 }).sort((a,b)=>({ 'Highly likely':0,'Possibility':1,'Least likely but worth a shot':2}[a.likelihood]-{'Highly likely':0,'Possibility':1,'Least likely but worth a shot':2}[b.likelihood])||b.score-a.score||b.job.jobTotal-a.job.jobTotal);
 const opportunities=allOpportunities.filter(x=>!x.trackingClosed);
 return{jobs,permitReviews,materialReviews,scheduledReviews,opportunities,allOpportunities};
}
function schedulingRankChip(x){
 const c=x==='Highly likely'?'high':x==='Possibility'?'possible':'low';return`<span class="sch-rank ${c}">${esc(x)}</span>`;
}
function permitMini(p){
 if(!p||!p.found)return statusChip('Permit unknown','warn');
 return statusChip(p.applicable==='N'?'N • No permit':p.applicable==='F'?'F • Final only':p.applicable==='RF'?'RF • Rough + final':p.applicable==='Y'?'Y • Verify':'Unknown',p.ready?'good':p.applicable==='RF'?'bad':'warn');
}

function arWeekStartISO(ref=asOf()){
 const d=new Date(String(ref||asOf())+'T12:00:00');
 if(isNaN(d))return'';
 const back=(d.getDay()+6)%7;
 d.setDate(d.getDate()-back);
 return d.toISOString().slice(0,10);
}
function arWeekEndISO(ref=asOf()){
 const ws=arWeekStartISO(ref);if(!ws)return'';
 const d=new Date(ws+'T12:00:00');d.setDate(d.getDate()+6);return d.toISOString().slice(0,10);
}
function arThursdayISO(ref=asOf()){
 const ws=arWeekStartISO(ref);if(!ws)return'';
 const d=new Date(ws+'T12:00:00');d.setDate(d.getDate()+3);return d.toISOString().slice(0,10);
}
function arCurrentWeekUpdate(j,ref=asOf()){

 return (j.arTrackerHistory||[]).find(x=>x&&x.weekStart===ws)||null;
}
function arTrackerWeeklyStatus(j,ref=asOf()){

 return{key:'due',label:day===4?'Due Tonight':'Due by Thursday',tone:'warn',detail:`Due ${fmtDate(due)}`,update:null};
}

 const ws=arTrackerWeeklyStatus(j),current=ws.update,weekStart=arWeekStartISO(),weekEnd=arWeekEndISO();
 const history=(j.arTrackerHistory||[]).slice().sort((a,b)=>(b.weekStart||'').localeCompare(a.weekStart||'')).slice(0,8);

 openModal(`AR Job #${j.jobNumber}`,`
  <div class="grid two">
   <div class="field"><label>Accounting Status</label><input class="input" value="${esc(j.accountingStatus||j.status)}" disabled></div>
   <div class="field"><label>Business Unit</label><input class="input" value="${esc(j.businessUnit)}" disabled></div>
  </div>
  <div class="field" style="margin-top:12px"><label>Manager Notes</label><textarea class="textarea" id="arNotes" rows="5">${esc(j.managerNotes||'')}</textarea></div>
  <div class="alert ${ws.key==='overdue'?'bad':ws.key==='current'?'info':'warn'}" style="margin-top:12px"><b>This week (${fmtDate(weekStart)}–${fmtDate(weekEnd)}):</b> ${esc(ws.label)} • ${esc(ws.detail)}</div>
  <div class="field" style="margin-top:12px"><label><input type="checkbox" id="arTrackerUpdated" ${current?'checked':''}> AR Tracker updated for this week</label></div>
  <div class="field" style="margin-top:12px"><label>AR Tracker Updated Date</label><input class="input" type="date" id="arTrackerDate" min="${weekStart}" max="${weekEnd}" value="${esc(current?.updatedDate||todayISO())}"></div>
  ${history.length?`<div class="section-title" style="margin-top:16px">Weekly Update History</div><div class="table-wrap"><table class="table"><thead><tr><th>Week</th><th>Updated</th></tr></thead><tbody>${history.map(h=>`<tr><td>${fmtDate(h.weekStart)}</td><td>${fmtDate(h.updatedDate)}${h.updatedAt?`<div class="muted" style="font-size:9px">${esc(formatImportDateTime(h.updatedAt))}</div>`:''}</td></tr>`).join('')}</tbody></table></div>`:''}
 `,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="saveARJob">Save</button>`);

 const cb=$('#arTrackerUpdated'),dt=$('#arTrackerDate');
 cb.onchange=()=>{if(cb.checked&&!dt.value)dt.value=todayISO()};

 $('#saveARJob').onclick=()=>{
  const newNotes=$('#arNotes').value.trim(),wasCurrent=!!arCurrentWeekUpdate(j);
  j.managerNotes=newNotes;
  j.arTrackerHistory=Array.isArray(j.arTrackerHistory)?j.arTrackerHistory:[];

  // Replace/remove only the current week's record. Prior weeks remain historical.
  j.arTrackerHistory=j.arTrackerHistory.filter(x=>x&&x.weekStart!==weekStart);

  if(cb.checked){
   const chosen=dt.value||todayISO();
   if(chosen<weekStart||chosen>weekEnd){toast('AR Tracker date must be within the current Monday–Sunday week.');return}
   j.arTrackerHistory.push({weekStart,updatedDate:chosen,updatedAt:new Date().toISOString()});
  }

  audit('AR job updated',`Job #${j.jobNumber}`,
   `${cb.checked?'AR Tracker updated for week of '+fmtDate(weekStart)+' on '+fmtDate(dt.value||todayISO()):wasCurrent?'Current-week AR Tracker update removed':'AR Tracker still due this week'}${newNotes?' • Notes updated':''}`);

  saveSoon();closeModal();renderAR();
  if(currentView==='home')renderHome();
 };
}

 add(termBad.length?'fail':'pass','Termination effective-date rule',termBad.length?`${termBad.length} terminated employee${termBad.length===1?' is':'s are'} incorrectly active on the termination date.`:'Terminated employees become inactive beginning on the entered effective date.','Rule Integrity');

 const sun=nextSunday(),far=addDaysISO(sun,14);
 add(sun&&sundayNeedsReview(sun)&&!sundayNeedsReview(far)?'pass':'fail','Sunday placeholder rule',sun?`Near-term Sunday ${fmtDate(sun)} flags; far-future Sunday ${fmtDate(far)} remains a placeholder.`:'Unable to construct Sunday test dates.','Rule Integrity');

 const cap=homeCapacitySnapshot(),ctx=futureCapacityContext();

 const reqUnknown=(state.reqRecords||[]).filter(r=>{const e=employeeByName(r.Name);return !e&&!employeeExcludedFromReporting(r.Name,latestImport('assigned-jobs')?.dateThrough||asOf())});
 add(reqUnknown.length?'warn':'pass','REQ employee linkage',reqUnknown.length?`${reqUnknown.length} REQ row${reqUnknown.length===1?' has':'s have'} an unresolved employee name and should remain out of authoritative scorecards.`:'REQ employee names are linked or explicitly excluded.');
 const surveyUnknown=surveyEmployeeMismatches();
 add(surveyUnknown.length?'warn':'pass','Survey employee linkage',surveyUnknown.length?`${surveyUnknown.length} survey employee name${surveyUnknown.length===1?' needs':'s need'} a Manager Reporting Decision.`:'Survey employee names are linked or explicitly excluded.');

 const sch=advancedSchedulingData(),badPermitRelease=sch.permitReviews.filter(p=>p.applicable==='RF'&&p.ready);
 add(!state.permits.length||!state.deadStock.length||!state.workflowRows.length?'warn':badPermitRelease.length?'fail':'pass','Advanced Scheduling rule engine',!state.permits.length||!state.deadStock.length||!state.workflowRows.length?'Workflow, Permit Reference, and Dead Stock are all required to fully rank opportunities.':badPermitRelease.length?`${badPermitRelease.length} RF permit row(s) were incorrectly marked releasable.`:`${sch.opportunities.length} opportunity rows analyzed; RF permit rows remain held, exact/potential material matches are separated, near-size pans are limited to ±2 inches per dimension, and drain relocation review permits only Left/Right ↔ Center — never Left ↔ Right.`,'Rule Integrity');
 const closedLeak=sch.opportunities.filter(x=>schedulingFollowupClosed(x.job.jobNumber));
 add(closedLeak.length?'fail':'pass','Move-up tracking suppression',closedLeak.length?`${closedLeak.length} Scheduled/Can’t Move Up job(s) leaked back into the active opportunity queue.`:'Scheduled and Can’t Move Up outcomes are excluded from the active queue while tracking history is preserved.','Rule Integrity');
 const cov=payrollCoverageBounds();
 add(cov.start&&cov.end?'pass':'warn','Payroll coverage metadata',cov.start&&cov.end?`Payroll coverage is ${fmtDate(cov.start)} through ${fmtDate(cov.end)}.`:'Payroll coverage start/end is not available.');
 add((state.observedHolidays||[]).length&&holidayScheduleCoverageEnd()>=monthEndISO(asOf())?'pass':'warn','Observed holiday coverage',holidayScheduleCoverageEnd()?`Holiday calendar entered through ${fmtDate(holidayScheduleCoverageEnd())}.`:'No observed holidays are entered.');
 return checks;
}
function diagnosticStatusChip(status){return statusChip(status==='pass'?'PASS':status==='fail'?'FAIL':'REVIEW',status==='pass'?'good':status==='fail'?'bad':'warn')}
function diagnosticsHtml(){
 const checks=diagnosticChecks(),fail=checks.filter(x=>x.status==='fail').length,warn=checks.filter(x=>x.status==='warn').length,pass=checks.filter(x=>x.status==='pass').length;
 return `<div class="grid kpi">${kpi('Passed',pass,'Rule/data checks')}${kpi('Review',warn,'Current data or cleanup')}${kpi('Failed',fail,fail?'Potential logic regression':'No rule failures detected')}${kpi('Build',SEED.version,'Current dashboard version')}</div>
 <div class="section-title">Automated Diagnostics</div><div class="section-note">FAIL means a locked rule is behaving inconsistently. REVIEW means the application is functioning, but current source or employee data needs attention.</div>
 <div class="diag-table">${checks.map(x=>`<div class="diag-row"><div>${diagnosticStatusChip(x.status)}<div class="muted" style="font-size:8.5px;margin-top:5px">${esc(x.group)}</div></div><div><div class="diag-title">${esc(x.title)}</div><div class="diag-detail">${esc(x.detail)}</div></div></div>`).join('')}</div>
 <div class="section-title">Architecture Watch List</div><div class="card"><div class="rule-box"><b>Local browser storage:</b> this development build still stores the working database in IndexedDB. Keep exporting JSON backups before deployments or device changes.</div><div class="rule-box" style="margin-top:8px"><b>Shared manager sync:</b> not implemented yet by design. The future target remains one application with isolated shared market workspaces using the company Microsoft/SharePoint environment after the local workflow is finalized.</div><div class="rule-box" style="margin-top:8px"><b>Payroll payout:</b> final commission payout remains in the separate locked Payroll Automator; this manager dashboard should not silently recreate or alter that engine.</div></div>`;
}

// ---------- Audit / Admin ----------
function renderAudit(){
 const el=$('#view-audit'),issues=moduleDataIssues('audit');
 el.innerHTML=pageHead('Audit & Administration','Diagnostics protects locked business rules; Audit preserves change history; Administration handles backups and master employee controls.',`<button class="btn" id="restoreBtn">Restore Backup</button><button class="btn" id="auditExcelBtn">Export Audit Excel</button><button class="btn primary" id="backupBtn">Export JSON Backup</button>`)+dataConfidenceBanner(issues)+`
 <div class="tabs"><button class="tab ${auditTab==='diagnostics'?'active':''}" data-audit-tab="diagnostics">Diagnostics</button><button class="tab ${auditTab==='history'?'active':''}" data-audit-tab="history">Audit History</button><button class="tab ${auditTab==='admin'?'active':''}" data-audit-tab="admin">Administration</button></div><div id="auditBody"></div>`;
 $('#backupBtn').onclick=exportBackup;$('#globalBackup').onclick=exportBackup;$('#auditExcelBtn').onclick=()=>exportSection('audit');$('#restoreBtn').onclick=()=>$('#restoreInput').click();
 el.querySelectorAll('[data-audit-tab]').forEach(b=>b.onclick=()=>{auditTab=b.dataset.auditTab;renderAudit()});
 const body=$('#auditBody');
 if(auditTab==='diagnostics'){
  body.innerHTML=diagnosticsHtml()+`<div style="margin-top:12px"><button class="btn" id="rerunDiagnostics">Rerun Diagnostics</button></div>`;
  $('#rerunDiagnostics').onclick=renderAudit;
 }else if(auditTab==='history'){
  body.innerHTML=`<div class="grid kpi">${kpi('Audit Entries',state.audit.length,'Newest first')}${kpi('Imports',state.imports.length,'Report history')}${kpi('Employees',activeEmployees(asOf()).length,`${state.employees.length} total Employee Manager records`)}${kpi('Employment Changes',employmentHistoryFlat().length,'Effective-dated history')}</div><div class="section-title">Audit History</div>${auditTable()}`;
 }else{
  body.innerHTML=`<div class="grid two"><div class="card"><div class="card-title">Employee Manager</div><p class="muted" style="font-size:11px;line-height:1.5">Employee Manager is the reporting source of truth for effective-dated role, team, commission, hourly rate, hire, termination, and discard decisions. Roster uploads only help populate this section.</p><button class="btn" id="auditAddEmployee">Add New Hire</button><button class="btn" style="margin-left:6px" id="openCallouts">Open Employee Management</button></div><div class="card"><div class="card-title">Exports & Data Safety</div><div class="rule-box"><b>Export Audit Excel</b> creates the human-readable audit workbook.<br><br><b>Export JSON Backup</b> is the full restorable local database and should be used before moving devices or deploying a replacement version.</div></div></div>`;
  $('#auditAddEmployee').onclick=()=>openEmployeeModal();$('#openCallouts').onclick=()=>{payrollTab='employees';employeeRosterFilter='active';navigate('payroll')};
 }
}
function auditTable(){return `<div class="table-wrap"><table class="table"><thead><tr><th>Time</th><th>Action</th><th>Entity</th><th>Details</th></tr></thead><tbody>${state.audit.slice(0,250).map(a=>`<tr><td class="nowrap">${new Date(a.ts).toLocaleString()}</td><td class="strong">${esc(a.action)}</td><td>${esc(a.entity)}</td><td>${esc(a.details)}</td></tr>`).join('')}</tbody></table></div>`}
function exportBackup(){const blob=new Blob([JSON.stringify({app:'Bath Manager Dashboard',version:SEED.version,exportedAt:new Date().toISOString(),state},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`Bath_Manager_Dashboard_Backup_${todayISO()}.json`;a.click();URL.revokeObjectURL(a.href);audit('Backup exported','Database',a.download);toast('Backup exported')}
async function restoreBackup(file){try{const d=JSON.parse(await file.text());if(!d.state)throw Error('Not a dashboard backup');state=d.state;ensureShape();audit('Backup restored','Database',file.name);await dbSet('state',state);toast('Backup restored');renderAll()}catch(e){toast('Backup could not be restored')}}

// ---------- Init ----------
function bindGlobal(){buildNav();$('#modalClose').onclick=closeModal;$('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()};$('#mobileMenu').onclick=()=>$('#sidebar').classList.toggle('open');$('#globalBackup').onclick=exportBackup;$('#restoreInput').onchange=e=>e.target.files[0]&&restoreBackup(e.target.files[0]);document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g)navigate(g.dataset.go)})}
async function rebuildCapacityAfterStartup(){
 try{refreshPayrollLeaveLinks();rebuildCapacityCrewHistory();rebuildWBRData();applyInitialCapacityConfirmations();saveSoon();if(currentView==='capacity'||currentView==='home')renderAll()}catch(e){state.startupWarnings=state.startupWarnings||[];state.startupWarnings.push(`Derived-data rebuild skipped: ${e.message||e}`);try{saveSoon();if(currentView==='home')renderHome()}catch(_){}}
}
async function init(){await loadState();state.settings=state.settings||{};if(state.settings.asOf==='2026-11-18')delete state.settings.asOf;bindGlobal();navigate('home');setTimeout(rebuildCapacityAfterStartup,0)}
async function recoverStartup(primaryError){
 try{
  if(!state||typeof state!=='object')state=structuredClone(SEED);
  state.startupWarnings=Array.isArray(state.startupWarnings)?state.startupWarnings:[];
  state.startupWarnings.push(`Startup recovery mode: ${primaryError?.message||primaryError}`);
  ensureShape();
  state.settings=state.settings||{};if(state.settings.asOf==='2026-11-18')delete state.settings.asOf;
  bindGlobal();
  navigate('home');
  try{saveSoon()}catch(_){}
 }catch(recoveryError){
  const safe=x=>String(x||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  document.body.innerHTML=`<div style="font-family:Arial,sans-serif;padding:24px;max-width:900px;margin:auto"><h2>Bath Manager Dashboard could not open</h2><p>Your saved database was not deleted.</p><pre style="white-space:pre-wrap;background:#f5f7f8;padding:16px;border-radius:10px">${safe(primaryError?.stack||primaryError||'Unknown startup error')}</pre><p>Recovery error:</p><pre style="white-space:pre-wrap;background:#f5f7f8;padding:16px;border-radius:10px">${safe(recoveryError?.stack||recoveryError)}</pre></div>`;
 }
}
init().catch(recoverStartup);
</script>
</body></html>
