<style>
:root{

 --info:#2d6c88; --infobg:#eaf4f9; --shadow:0 8px 26px rgba(28,52,64,.08);
 --radius:16px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{min-height:100vh;display:flex}
.sidebar{width:240px;background:linear-gradient(180deg,var(--navy),#1e323c);color:#fff;position:fixed;inset:0 auto 0 0;padding:22px 14px;display:flex;flex-direction:column;z-index:20}
.brand{padding:0 12px 20px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:12px}
.brand small{display:block;color:#a8c4cf;text-transform:uppercase;letter-spacing:.14em;font-size:10px;font-weight:800}.brand strong{display:block;font-size:20px;margin-top:6px;letter-spacing:-.02em}.brand span{font-size:12px;color:#c5d6dc}
.nav{display:flex;flex-direction:column;gap:4px;overflow:auto;padding:4px 0 16px}.nav button{border:0;background:transparent;color:#dce8ec;text-align:left;border-radius:11px;padding:11px 12px;display:flex;align-items:center;gap:10px;font-weight:650;font-size:13px}.nav button:hover{background:rgba(255,255,255,.08)}.nav button.active{background:rgba(47,184,157,.18);color:#fff;box-shadow:inset 3px 0 0 var(--teal)}.nav-icon{width:25px;height:25px;border-radius:8px;background:rgba(255,255,255,.09);display:grid;place-items:center;font-size:12px;font-weight:900}.nav button.active .nav-icon{background:var(--teal);color:#14352e}
.sidebar-foot{margin-top:auto;padding:12px;color:#abc0c9;font-size:11px;line-height:1.4}.sidebar-foot b{color:#fff}
.main{margin-left:240px;min-width:0;width:calc(100% - 240px)}
.topbar{height:70px;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:15;display:flex;align-items:center;justify-content:space-between;padding:0 26px}.topbar h1{font-size:18px;margin:0;letter-spacing:-.02em}.topbar .subtitle{font-size:12px;color:var(--muted);margin-top:2px}.top-actions{display:flex;gap:9px;align-items:center}.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:7px 10px;background:#f0f5f6;color:#53656f;font-size:11px;font-weight:700}.dot{width:8px;height:8px;border-radius:50%;background:var(--teal)}
.content{padding:24px 26px 48px;max-width:1540px;margin:0 auto}.view{display:none}.view.active{display:block}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:20px}.page-head h2{font-size:25px;margin:0 0 5px;letter-spacing:-.035em}.page-head p{margin:0;color:var(--muted);font-size:13px;max-width:800px;line-height:1.55}.page-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:10px;padding:9px 12px;font-weight:750;font-size:12px;box-shadow:0 1px 1px rgba(0,0,0,.02)}.btn:hover{border-color:#b9c9d0;background:#fbfdfd}.btn.primary{background:var(--teal);border-color:var(--teal);color:#0a332a}.btn.dark{background:var(--navy);border-color:var(--navy);color:#fff}.btn.danger{background:#fff;border-color:#efc6ca;color:var(--bad)}.btn.small{padding:6px 9px;font-size:11px}.btn:disabled{opacity:.45;cursor:not-allowed}
.grid{display:grid;gap:14px}.grid.kpi{grid-template-columns:repeat(4,minmax(0,1fr))}.grid.two{grid-template-columns:1.35fr .65fr}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.grid.attention{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:17px}.card.flush{padding:0;overflow:hidden}.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.card-title{font-size:13px;font-weight:850;letter-spacing:-.01em}.card-sub{color:var(--muted);font-size:11px}.kpi-card{min-height:118px;position:relative;overflow:hidden}.kpi-card:after{content:"";position:absolute;width:80px;height:80px;border-radius:50%;right:-22px;top:-25px;background:rgba(47,184,157,.08)}.kpi-label{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:850}.kpi-value{font-size:27px;font-weight:850;letter-spacing:-.04em;margin:8px 0 4px}.kpi-meta{font-size:11px;color:var(--muted)}
.attn-card{padding:0;overflow:hidden;transition:.16s transform,.16s box-shadow;cursor:pointer}.attn-card:hover{transform:translateY(-1px);box-shadow:0 10px 30px rgba(28,52,64,.12)}.attn-top{height:5px;background:var(--teal)}.attn-card.warn .attn-top{background:#e7a62e}.attn-card.bad .attn-top{background:#d95863}.attn-body{padding:16px}.attn-title{display:flex;justify-content:space-between;gap:8px;align-items:center;font-weight:850;font-size:13px}.attn-num{font-size:24px;font-weight:850;letter-spacing:-.04em;margin:10px 0 2px}.attn-text{font-size:11px;color:var(--muted);line-height:1.45}.status{display:inline-flex;align-items:center;border-radius:999px;padding:4px 8px;font-size:10px;font-weight:850;white-space:nowrap}.status.good{background:var(--goodbg);color:var(--good)}.status.warn{background:var(--warnbg);color:var(--warn)}.status.bad{background:var(--badbg);color:var(--bad)}.status.info{background:var(--infobg);color:var(--info)}.status.gray{background:#edf1f3;color:#63747c}
.section-title{font-size:13px;font-weight:850;margin:22px 0 10px}.section-note{font-size:11px;color:var(--muted);margin-top:-6px;margin-bottom:10px}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:13px;background:#fff}.table{width:100%;border-collapse:collapse;font-size:11px;min-width:720px}.table th{position:sticky;top:0;background:#f3f7f8;color:#5d6e77;text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);font-size:9px;text-transform:uppercase;letter-spacing:.07em;white-space:nowrap;z-index:1}.table td{padding:9px 10px;border-bottom:1px solid #eef2f4;vertical-align:middle}.table tr:last-child td{border-bottom:0}.table tr:hover td{background:#fbfdfd}.money{font-variant-numeric:tabular-nums;font-weight:700}.muted{color:var(--muted)}.right{text-align:right}.center{text-align:center}.nowrap{white-space:nowrap}.strong{font-weight:800}
.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:10px;font-weight:800;color:#61727b;text-transform:uppercase;letter-spacing:.05em}.input,.select,.textarea{width:100%;border:1px solid #ccd8dd;background:#fff;border-radius:10px;padding:9px 10px;color:var(--text);outline:none}.input:focus,.select:focus,.textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(47,184,157,.12)}.textarea{min-height:78px;resize:vertical}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.form-grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.form-grid.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow:auto}.tab{border:0;background:transparent;padding:10px 11px;margin-bottom:-1px;border-bottom:2px solid transparent;color:var(--muted);font-size:12px;font-weight:800;white-space:nowrap}.tab.active{border-bottom-color:var(--teal);color:var(--text)}
.dropzone{border:1.5px dashed #a9bcc5;background:#fafdfe;border-radius:15px;padding:30px 18px;text-align:center;transition:.15s}.dropzone.drag{border-color:var(--teal);background:#f1fbf8}.dropzone strong{font-size:14px}.dropzone p{margin:6px 0 13px;color:var(--muted);font-size:11px}.hidden-input{display:none}
.report-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.report-card{border:1px solid var(--line);border-radius:13px;padding:13px;background:#fff}.report-title{font-size:12px;font-weight:850}.report-feeds{font-size:10px;color:var(--muted);margin:5px 0 9px;line-height:1.45}.fresh{font-size:10px;font-weight:800}.fresh.ok{color:var(--good)}.fresh.stale{color:var(--warn)}.fresh.missing{color:var(--bad)}
.bar-row{display:grid;grid-template-columns:140px 1fr 70px;gap:10px;align-items:center;margin:8px 0;font-size:10px}.bar-bg{height:8px;background:#edf2f4;border-radius:99px;overflow:hidden}.bar-fill{height:100%;background:var(--teal);border-radius:99px}.bar-fill.bad{background:#d95863}.bar-fill.warn{background:#e7a62e}
.empty{border:1px dashed #c6d3d8;background:#fbfdfd;border-radius:14px;padding:30px;text-align:center}.empty h3{margin:0 0 6px;font-size:15px}.empty p{color:var(--muted);font-size:11px;max-width:560px;margin:0 auto 13px;line-height:1.5}
.rule-box{background:#f8fbfc;border:1px solid var(--line);border-radius:13px;padding:13px;font-size:11px;line-height:1.55;color:#4e6069}.rule-box b{color:var(--text)}
.alert{border-radius:12px;padding:11px 12px;font-size:11px;line-height:1.45;margin-bottom:12px}.alert.warn{background:var(--warnbg);color:#805500;border:1px solid #f1dca8}.alert.info{background:var(--infobg);color:#285e76;border:1px solid #cce4ee}.alert.bad{background:var(--badbg);color:#8e1f29;border:1px solid #f2cbd0}
.action-banner{border:1px solid #efc6ca;background:linear-gradient(135deg,#fff7f8,#fdebed);border-radius:16px;padding:15px 16px;margin:0 0 16px;display:flex;align-items:center;justify-content:space-between;gap:14px;box-shadow:var(--shadow)}
.action-banner.warn{border-color:#f0d9a4;background:linear-gradient(135deg,#fffaf0,#fff3d6)}
.action-banner .action-copy{min-width:0}.action-banner .action-title{font-size:13px;font-weight:900;color:var(--bad);margin-bottom:5px}.action-banner.warn .action-title{color:var(--warn)}.action-banner .action-detail{font-size:11px;color:#6a5960;line-height:1.5}.action-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.employee-tools{display:flex;gap:8px;align-items:end;flex-wrap:wrap;margin:12px 0}.employee-tools .field{min-width:165px}.employee-row-action td{background:#fff8f8}.employee-row-watch td{background:#fffdf4}.employee-name{display:flex;flex-direction:column;gap:2px}.employee-name small{color:var(--muted);font-size:9px}.profile-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:12px 0}.profile-stat{border:1px solid var(--line);border-radius:12px;padding:10px;background:#fafcfd}.profile-stat .label{font-size:9px;color:var(--muted);font-weight:850;text-transform:uppercase;letter-spacing:.06em}.profile-stat .value{font-size:14px;font-weight:850;margin-top:4px}.subtle-link{border:0;background:transparent;padding:0;color:var(--info);font-size:10px;font-weight:800;text-decoration:underline;text-underline-offset:2px}

.modal-backdrop{position:fixed;inset:0;background:rgba(18,34,42,.46);display:none;align-items:center;justify-content:center;padding:18px;z-index:100}.modal-backdrop.open{display:flex}.modal{width:min(660px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:18px;box-shadow:0 24px 70px rgba(0,0,0,.24);border:1px solid #cbd8dd}.modal-head{padding:17px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.modal-head h3{margin:0;font-size:16px}.modal-body{padding:18px}.modal-foot{padding:13px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}.close-x{border:0;background:#f1f5f6;border-radius:9px;width:30px;height:30px;font-size:16px}
.toast{position:fixed;right:20px;bottom:20px;background:#213640;color:#fff;padding:11px 14px;border-radius:11px;font-size:11px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.2);opacity:0;transform:translateY(10px);pointer-events:none;transition:.2s;z-index:150}.toast.show{opacity:1;transform:none}
.review-item{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;border:1px solid var(--line);padding:11px;border-radius:11px;margin:8px 0}.review-item .meta{font-size:10px;color:var(--muted);margin-top:3px}
.mobile-menu{display:none;border:0;background:#edf3f5;border-radius:9px;padding:8px 10px;font-weight:800}
@media(max-width:1100px){.grid.attention{grid-template-columns:repeat(2,1fr)}.grid.kpi{grid-template-columns:repeat(2,1fr)}.grid.two{grid-template-columns:1fr}.report-grid{grid-template-columns:1fr}.form-grid.four{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){.sidebar{transform:translateX(-101%);transition:.2s;width:250px}.sidebar.open{transform:none}.main{margin-left:0;width:100%}.mobile-menu{display:inline-block}.topbar{padding:0 14px;height:62px}.content{padding:16px 13px 38px}.top-actions .pill{display:none}.page-head{align-items:flex-start;flex-direction:column}.grid.attention,.grid.kpi,.grid.three{grid-template-columns:1fr}.form-grid,.form-grid.three,.form-grid.four{grid-template-columns:1fr}.bar-row{grid-template-columns:100px 1fr 55px}.card{padding:14px}.page-head h2{font-size:22px}}

.employment-timeline{display:flex;flex-direction:column;gap:8px;margin-top:10px}.history-card{border:1px solid var(--line);border-radius:12px;padding:10px;background:#fff}.history-card .history-top{display:flex;justify-content:space-between;gap:8px;align-items:center}.history-card .history-title{font-weight:900;font-size:11px;color:var(--text)}.history-card .history-meta{font-size:9px;color:var(--muted);margin-top:4px;line-height:1.45}.history-card.future{border-color:#9fd7ee;background:#f5fbfe}.export-note{font-size:9px;color:var(--muted);margin-top:6px}.mini-pay{font-size:9px;color:var(--muted);margin-top:2px}
</style>
</head>

function maxDate(arr,key='date'){return arr.map(x=>x[key]).filter(Boolean).sort().at(-1)||''}
function uid(p='id'){return `${p}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,7)}`}

function ageDays(iso){if(!iso)return 9999;return Math.floor((new Date()-new Date(iso))/(864e5))}

function setAsOf(v){state.settings=state.settings||{};state.settings.asOf=v;saveSoon();renderAll()}
function employeeByName(name){return state.employees.find(e=>e.name===name)}
function employmentHistory(emp){return (emp?.employmentHistory||[]).slice().sort((a,b)=>(a.effectiveDate||'').localeCompare(b.effectiveDate||''))}
function employeeSnapshot(empOrName,ref=asOf()){
 const emp=typeof empOrName==='string'?employeeByName(empOrName):empOrName;if(!emp)return{role:'',team:'',commissionRate:'',hourlyRate:''};
 let snap={role:emp.role||'',team:emp.team||'',commissionRate:emp.commissionRate??'',hourlyRate:emp.hourlyRate??''};
 const hist=employmentHistory(emp);if(hist.length){snap={role:'',team:'',commissionRate:'',hourlyRate:''};for(const h of hist){if(h.effectiveDate&&h.effectiveDate<=ref){snap={role:h.role??snap.role,team:h.team??snap.team,commissionRate:h.commissionRate??snap.commissionRate,hourlyRate:h.hourlyRate??snap.hourlyRate}}}}
 return snap;
}
function syncEmployeeCurrentFields(emp){const snap=employeeSnapshot(emp,asOf());emp.role=snap.role||emp.role||'';emp.team=snap.team??emp.team??'';emp.commissionRate=snap.commissionRate??emp.commissionRate??'';emp.hourlyRate=snap.hourlyRate??emp.hourlyRate??''}
function employmentHistoryFlat(){const rows=[];for(const e of state.employees){for(const h of employmentHistory(e)){rows.push({Employee:e.name,'Effective Date':h.effectiveDate,'Change Type':h.type,Role:h.role||'',Team:h.team||'','Commission %':h.commissionRate===''?'':h.commissionRate,'Hourly Rate':h.hourlyRate===''?'':h.hourlyRate,Notes:h.notes||''})}}return rows.sort((a,b)=>(b['Effective Date']||'').localeCompare(a['Effective Date']||'')||a.Employee.localeCompare(b.Employee))}
function employmentStatusAt(emp,ref=asOf()){
 if(!emp)return'Unknown';
 if(emp.hireDate&&ref<emp.hireDate)return'Not Yet Hired';
 if(emp.status==='Inactive'&&!emp.terminationDate)return'Inactive';
 if(emp.terminationDate&&ref>emp.terminationDate)return'Terminated';
 if(emp.terminationDate&&ref===emp.terminationDate)return'Active — Final Day';
 return'Active';
}
function employeeActiveOn(empOrName,ref=asOf()){
 const emp=typeof empOrName==='string'?employeeByName(empOrName):empOrName;if(!emp)return true;
 if(emp.hireDate&&ref<emp.hireDate)return false;
 if(emp.status==='Inactive'&&!emp.terminationDate)return false;
 if(emp.terminationDate&&ref>emp.terminationDate)return false;
 return true;
}
function activeEmployees(ref=asOf()){return state.employees.filter(e=>employeeActiveOn(e,ref))}
function employeeStatusTone(emp,ref=asOf()){const st=employmentStatusAt(emp,ref);return st.startsWith('Active')?'good':st==='Not Yet Hired'?'info':'gray'}

function anniversaryWindow(emp,ref=asOf()){if(!emp?.hireDate)return {start:'',end:''};const h=new Date(emp.hireDate+'T12:00:00'),r=new Date(ref+'T12:00:00');let y=r.getFullYear();let start=new Date(y,h.getMonth(),h.getDate(),12);if(start>r)start=new Date(y-1,h.getMonth(),h.getDate(),12);let end=new Date(start.getFullYear()+1,start.getMonth(),start.getDate(),12);end.setDate(end.getDate()-1);return{start:start.toISOString().slice(0,10),end:end.toISOString().slice(0,10)}}
function calloutStats(emp){const w=anniversaryWindow(emp);const events=state.callouts.filter(c=>c.employee===emp.name && c.date>=w.start && c.date<=Math.min?false:true);const active=state.callouts.filter(c=>c.employee===emp.name && c.date>=w.start && c.date<=asOf());let grace=0,noPto=0;active.forEach(c=>c.ptoAvailable===false?noPto++:grace++);const points=Math.max(0,grace-5)+noPto;const actions=['No corrective action','Verbal','1st Written Warning','2nd Written Warning','Final Written Warning','Termination'];const next=points===0?(grace<5?`${6-grace} until Verbal`:'Next call out = Verbal'):points===1?'Next = 1st Written':points===2?'Next = 2nd Written':points===3?'Next = Final Written':points===4?'Next = Termination':'Termination threshold reached';return{...w,total:active.length,grace,noPto,points,action:actions[Math.min(points,5)],next}}
function surveyLatest(){const cutoff=asOf();const rows=state.surveyWeekly.filter(w=>w.weekEnd<=cutoff).sort((a,b)=>a.weekEnd.localeCompare(b.weekEnd));return rows.at(-1)||null}
function surveyWeekStats(row){if(!row)return{met:0,missed:0,excused:0,eligible:0};let met=0,missed=0,excused=0,eligible=0;for(const [k,v] of Object.entries(row)){if(k==='weekStart'||k==='weekEnd')continue;const emp=employeeByName(k);if(emp&&!employeeActiveOn(emp,row.weekEnd||asOf()))continue;if(v==='N/A'||v==null||v==='')continue;eligible++;if(v==='EXC'||v==='FMLA')excused++;else if(Number(v)>=1)met++;else missed++;}return{met,missed,excused,eligible}}
function prodDayJobs(date){return state.productionJobs.filter(j=>j.date===date && j.status!=='Deleted')}
function prodStats(date){const jobs=prodDayJobs(date);let confirmed=0,completed=0,actual=0,breakage=0,breakageJobs=0,incomplete=0,missing=0,vendor=0,expectedJobs=0;for(const j of jobs){const st=j.status||'Start';if(!CONFIRMED_EXCLUDE.has(st)){confirmed+=Number(j.confirmedTotal)||0;expectedJobs++}if(COMPLETED_STATUSES.has(st)){completed++;actual+=Number(j.actualCollected||0) || (Number(j.confirmedTotal)||0)+(Number(j.changeOrder)||0)}if(st==='Breakage/U2Day'){breakage+=Number(j.confirmedTotal)||0;breakageJobs++}if(INCOMPLETE_AUTO.has(st))incomplete+=Number(j.incomplete||j.confirmedTotal||0);if(j.missingItems)missing++;if(j.vendorIssue)vendor++;}const successRate=expectedJobs?completed/expectedJobs:0;return{jobs:jobs.length,confirmed,expectedJobs,completed,actual,breakage,breakageJobs,incomplete,missing,vendor,successRate}}
function latestProdDate(){return maxDate(state.productionJobs)}
function latestImport(type){return state.imports.filter(i=>i.reportType===type).sort((a,b)=>(a.importedAt||'').localeCompare(b.importedAt||'')).at(-1)}
function moduleFresh(type,days){const i=latestImport(type);if(!i)return['missing','Not imported'];const d=i.dateThrough||i.importedAt?.slice(0,10);const diff=d?Math.floor((new Date(asOf())-new Date(d))/(864e5)):9999;return diff<=days?['ok',`Current through ${fmtDate(d)}`]:['stale',`Last data ${fmtDate(d)}`]}

function correctiveActionBanner(action,at5){if(action.length){return `<div class="action-banner"><div class="action-copy"><div class="action-title">Corrective action needed — ${action.length} employee${action.length===1?'':'s'}</div><div class="action-detail">These employees have reached a corrective-action threshold in their current hire-date anniversary period.</div><div class="action-chips">${action.slice(0,6).map(x=>statusChip(`${x.e.name}: ${x.s.action}`,'bad')).join('')}${action.length>6?statusChip(`+${action.length-6} more`,'bad'):''}</div></div><button class="btn danger" data-go="callouts">Review Employees</button></div>`}if(at5.length){return `<div class="action-banner warn"><div class="action-copy"><div class="action-title">Call-out watch — ${at5.length} employee${at5.length===1?'':'s'} at the 5-call-out limit</div><div class="action-detail">Their next PTO-available call out reaches Verbal corrective action.</div><div class="action-chips">${at5.slice(0,6).map(x=>statusChip(x.e.name,'warn')).join('')}</div></div><button class="btn" data-go="callouts">Review Employees</button></div>`}return''}

function peopleAttention(action,sw){const misses=[];if(sw)for(const[k,v]of Object.entries(sw)){if(k==='weekStart'||k==='weekEnd')continue;const emp=employeeByName(k);if(emp&&!employeeActiveOn(emp,sw.weekEnd))continue;if(Number(v)===0)misses.push(k)};const rows=[...action.slice(0,3).map(x=>`<div class="review-item"><div><b>${esc(x.e.name)}</b><div class="meta">${x.s.total} active call outs • ${x.s.noPto} without PTO</div></div>${statusChip(x.s.action,'bad')}</div>`),...misses.slice(0,3).map(n=>`<div class="review-item"><div><b>${esc(n)}</b><div class="meta">No grading survey for week ending ${fmtDate(sw.weekEnd)}</div></div>${statusChip('Survey missed','bad')}</div>`)].join('');return rows||`<div class="muted" style="font-size:11px">No immediate people-related actions.</div>`}

async function unzipXlsx(buffer){const dv=new DataView(buffer);let eocd=-1;for(let i=dv.byteLength-22;i>=Math.max(0,dv.byteLength-65557);i--){if(dv.getUint32(i,true)===0x06054b50){eocd=i;break}}if(eocd<0)throw Error('Invalid XLSX/ZIP file');const entries=dv.getUint16(eocd+10,true);let pos=dv.getUint32(eocd+16,true);const files={};const dec=new TextDecoder();for(let n=0;n<entries;n++){if(dv.getUint32(pos,true)!==0x02014b50)break;const method=dv.getUint16(pos+10,true),csize=dv.getUint32(pos+20,true),usize=dv.getUint32(pos+24,true),fnl=dv.getUint16(pos+28,true),exl=dv.getUint16(pos+30,true),coml=dv.getUint16(pos+32,true),lho=dv.getUint32(pos+42,true);const name=dec.decode(new Uint8Array(buffer,pos+46,fnl));const lfn=dv.getUint16(lho+26,true),lex=dv.getUint16(lho+28,true),dataStart=lho+30+lfn+lex;const comp=new Uint8Array(buffer,dataStart,csize);let data;if(method===0)data=comp;else if(method===8){const ds=new DecompressionStream('deflate-raw');data=new Uint8Array(await new Response(new Blob([comp]).stream().pipeThrough(ds)).arrayBuffer())}else throw Error(`Unsupported ZIP compression ${method}`);files[name]=data;pos+=46+fnl+exl+coml}return files}
function colIndex(ref){const m=/^([A-Z]+)/.exec(ref);let n=0;for(const c of m[1])n=n*26+c.charCodeAt(0)-64;return n-1}
async function parseXlsx(file){const files=await unzipXlsx(await file.arrayBuffer());const td=new TextDecoder();const xml=n=>new DOMParser().parseFromString(td.decode(files[n]),'application/xml');const shared=[];if(files['xl/sharedStrings.xml']){for(const si of xml('xl/sharedStrings.xml').getElementsByTagNameNS('*','si'))shared.push(si.textContent||'')}const wb=xml('xl/workbook.xml'),rels=xml('xl/_rels/workbook.xml.rels');const rmap={};for(const r of rels.getElementsByTagNameNS('*','Relationship'))rmap[r.getAttribute('Id')]=r.getAttribute('Target');const sheets=[];for(const s of wb.getElementsByTagNameNS('*','sheet')){const name=s.getAttribute('name'),rid=s.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id'),target=rmap[rid].replace(/^\//,'');const path=target.startsWith('xl/')?target:'xl/'+target;const sx=xml(path),rows=[];for(const row of sx.getElementsByTagNameNS('*','row')){const arr=[];for(const c of row.getElementsByTagNameNS('*','c')){const ref=c.getAttribute('r'),t=c.getAttribute('t');let val='';if(t==='inlineStr')val=c.textContent||'';else{const v=c.getElementsByTagNameNS('*','v')[0];if(!v)continue;const raw=v.textContent;if(t==='s')val=shared[Number(raw)]??'';else if(t==='b')val=raw==='1';else{const num=Number(raw);val=Number.isFinite(num)?num:raw}}arr[colIndex(ref)]=val}rows.push(arr)}sheets.push({name,rows})}return{sheets}}
function rowText(r){return r.map(x=>String(x??'')).join(' | ').toLowerCase()}
function detectReport(book){const sheetNames=book.sheets.map(s=>s.name.toLowerCase()).join(' ');const sample=book.sheets.flatMap(s=>s.rows.slice(0,30).map(rowText)).join('\n');const has=(...x)=>x.every(v=>sample.includes(v));if(sheetNames.includes('lead summary')&&sheetNames.includes('weekly tracker'))return{id:'grading-surveys',label:'Grading Survey Tracker',feeds:['Grading Surveys'],confidence:'High'};if(has('job #','customer name','job total','installer','status'))return{id:'daily-production',label:'Daily Production / Complete-Confirmed',feeds:['Daily Production'],confidence:'High'};if(has('employee name','activity','job number','business unit','memo'))return{id:'tech-timesheet',label:'ServiceTitan Tech Timesheet',feeds:['Payroll','Call Outs','Capacity','Grading Surveys'],confidence:'High'};if(has('last appt date','job status')&&(sample.includes('jobs total')||sample.includes('job total')))return{id:'production-workflow',label:'Production Workflow',feeds:['Capacity','Advanced Scheduling','WBR'],confidence:'High'};if(sheetNames.includes('production')&&(sample.includes('confirmed')||sample.includes('completed')))return{id:'regional-tracker',label:'Regional Tracker',feeds:['WBR'],confidence:'Medium'};if(sheetNames.includes('dead')||sample.includes('dead pans'))return{id:'dead-stock',label:'Dead Stock Inventory',feeds:['Advanced Scheduling'],confidence:'Medium'};if(sample.includes('municipality')&&sample.includes('permit'))return{id:'permit-reference',label:'Permit Quick Reference',feeds:['Advanced Scheduling'],confidence:'Medium'};if(sample.includes('commission')&&sample.includes('hourly'))return{id:'payroll-roster',label:'Payroll Employee / Rate Roster',feeds:['Payroll'],confidence:'Medium'};if(sample.includes('assigned technicians')&&sample.includes('job total'))return{id:'assigned-jobs',label:'Assigned Job Report',feeds:['REQ'],confidence:'Medium'};return{id:'unknown',label:'Unrecognized Excel report',feeds:[],confidence:'Review'} }
async function processFiles(files){for(const f of files){try{toast(`Reading ${f.name}…`);const book=await parseXlsx(f),det=detectReport(book);const id=uid('imp');let through='';if(det.id==='daily-production')through=importDaily(book,id);else if(det.id==='grading-surveys')through=importSurveys(book,id);else if(det.id==='tech-timesheet')through=importTechTimesheet(book,id);else if(det.id==='production-workflow')through=importWorkflow(book,id);else if(det.id==='dead-stock')through=importRawList(book,'deadStock');else if(det.id==='permit-reference')through=importRawList(book,'permits');else if(det.id==='assigned-jobs')through=importRawList(book,'reqRecords');state.imports.push({id,fileName:f.name,reportType:det.id,label:det.label,feeds:det.feeds,confidence:det.confidence,importedAt:new Date().toISOString(),dateThrough:through,status:det.id==='unknown'?'Needs mapping':'Imported'});audit('Report imported',f.name,`${det.label} → ${det.feeds.join(', ')||'manual review'}`);saveSoon();toast(`${f.name}: ${det.label}`)}catch(err){console.error(err);toast(`Could not read ${f.name}`);state.reviewQueue.push({id:uid('rev'),status:'pending',type:'Import Error',title:f.name,details:String(err.message||err),date:todayISO()})}}renderImports()}
function excelSerialToISO(v){if(typeof v!=='number')return String(v||'');const d=new Date(Date.UTC(1899,11,30)+v*864e5);return d.toISOString().slice(0,10)}
function parseDateCell(v){if(typeof v==='number')return excelSerialToISO(v);if(!v)return'';const d=new Date(v);return isNaN(d)?String(v):d.toISOString().slice(0,10)}
function importDaily(book,importId){let latest='';for(const s of book.sheets){let date='';for(const r of s.rows){const first=String(r[0]??'');if(/^(Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sunday),/.test(first)){const d=new Date(first);if(!isNaN(d))date=d.toISOString().slice(0,10);continue}if(!date)continue;const job=r[0];if(job==null||String(job).toLowerCase()==='job #'||!/^[0-9]+$/.test(String(job).trim()))continue;const total=Number(r[2]||0);if(!total&&!r[1])continue;const st=String(r[6]||'Start');const key=`${date}-${job}`;let x=state.productionJobs.find(j=>`${j.date}-${j.jobNumber}`===key);if(!x){x={id:uid('job'),date,jobNumber:String(job),changeOrder:0,actualCollected:0,closed:false,source:importId};state.productionJobs.push(x)}if(!x.closed){Object.assign(x,{customer:String(r[1]||''),confirmedTotal:total,incomplete:Number(r[3]||0),installers:String(r[4]||''),notes:String(r[5]||''),status:st,missingItems:String(r[7]||''),vendorIssue:String(r[8]||'')});if(COMPLETED_STATUSES.has(st)&&!x.actualCollected)x.actualCollected=total+(Number(x.changeOrder)||0)}latest=latest>date?latest:date}}return latest}
function importSurveys(book,importId){const ls=book.sheets.find(s=>s.name.toLowerCase()==='lead summary'),wt=book.sheets.find(s=>s.name.toLowerCase()==='weekly tracker');let through='';if(ls){const header=ls.rows.findIndex(r=>r.some(x=>String(x)==='Lead Installer'));if(header>=0){state.surveySummary=[];for(const r of ls.rows.slice(header+1)){if(!r[1]||r[0]==='GRAND TOTAL')continue;state.surveySummary.push({team:r[0],name:r[1],totalSurveys:Number(r[2]||0),requiredWeeks:Number(r[3]||0),weeksMet:Number(r[4]||0),missedWeeks:Number(r[5]||0),compliance:Number(r[6]||0),leaveDays:Number(r[7]||0),excusedWeeks:Number(r[8]||0),notes:String(r[10]||'')})}}}if(wt){const hdr=wt.rows.findIndex(r=>r[0]==='Week Starting'),names=hdr>=0?wt.rows[hdr]:[];state.surveyWeekly=[];for(const r of wt.rows.slice(hdr+1)){if(!r[0])continue;const ws=parseDateCell(r[0]),we=parseDateCell(r[1]);const o={weekStart:ws,weekEnd:we};for(let c=2;c<names.length;c++)if(names[c])o[names[c]]=r[c];state.surveyWeekly.push(o);if(we>through&&r.slice(2).some(v=>v!==undefined&&v!==null&&v!==''))through=we}}return through}
function findHeaderRows(book,required){for(const s of book.sheets){for(let i=0;i<Math.min(s.rows.length,50);i++){const low=s.rows[i].map(x=>String(x??'').trim().toLowerCase());if(required.every(k=>low.includes(k)))return{s,row:i,headers:low}}}return null}
function importTechTimesheet(book,importId){const h=findHeaderRows(book,['employee name','date','activity']);if(!h)return'';const idx={};h.headers.forEach((x,i)=>idx[x]=i);let latest='';for(const r of h.s.rows.slice(h.row+1)){const emp=r[idx['employee name']],date=parseDateCell(r[idx['date']]),activity=String(r[idx['activity']]||''),memo=String(r[idx['memo']]||'');if(date>latest)latest=date;if(!emp||!date)continue;if(/call\s*out|callout|called\s*out/i.test(activity+' '+memo)){const rosterEmp=employeeByName(String(emp));if(rosterEmp&&!employeeActiveOn(rosterEmp,date))continue;if(!state.callouts.some(c=>c.employee===emp&&c.date===date)&&!state.reviewQueue.some(q=>q.employee===emp&&q.date===date&&q.status==='pending'))state.reviewQueue.push({id:uid('rev'),status:'pending',type:'Potential Call Out',title:`${emp} — possible call out`,employee:String(emp),date,memo,details:memo||activity,source:importId})}}return latest}
function importWorkflow(book,importId){const h=findHeaderRows(book,['last appt date','job status']);if(!h)return'';const headers=h.s.rows[h.row].map(x=>String(x??'').trim());state.workflowRows=[];let latest='';for(const r of h.s.rows.slice(h.row+1)){if(!r.some(v=>v!==undefined&&v!==null&&v!==''))continue;const o={};headers.forEach((x,i)=>{if(x)o[x]=r[i]});state.workflowRows.push(o);const d=parseDateCell(o['Last Appt Date']??o['last appt date']);if(d>latest)latest=d}return latest}
function importRawList(book,key){const first=book.sheets[0];const headers=(first.rows[0]||[]).map(x=>String(x??'').trim());state[key]=first.rows.slice(1).filter(r=>r.some(v=>v!==undefined&&v!==null&&v!=='')).map(r=>{const o={};headers.forEach((h,i)=>{if(h)o[h]=r[i]});return o});return asOf()}

function renderDaily(){const el=$('#view-daily');if(!dailyDate)dailyDate=latestProdDate()||asOf();const s=prodStats(dailyDate),jobs=state.productionJobs.filter(j=>j.date===dailyDate);el.innerHTML=pageHead('Daily Production','Morning confirmed jobs and revenue → end-of-day successful jobs, collected revenue, breakage/blowouts, missing items, and vendor issues.',`<button class="btn" onclick="exportSection('daily')">Export Excel</button><input class="input" style="width:150px" id="prodDate" type="date" value="${dailyDate}"><button class="btn primary" id="addProdJob">Add job</button><button class="btn dark" id="closeDay">Close day</button>`)+`
 <div class="grid kpi">
  ${kpi('Confirmed Revenue',money(s.confirmed),`${s.expectedJobs} expected jobs`)}${kpi('Collected Revenue',money(s.actual),`${s.completed} successful`)}${kpi('Breakage / U2Day',money(s.breakage),`${s.breakageJobs} jobs`)}${kpi('Success Rate',pct(s.successRate),`${s.completed}/${s.expectedJobs} expected jobs completed`)}
 </div>
 <div class="section-title">Daily Closeout</div><div class="section-note">Status meanings and confirmed/incomplete behavior remain aligned to the Complete/Confirmed tracker.</div>
 ${jobs.length?productionTable(jobs):empty('No jobs for this date','Add a job manually or import the Complete/Confirmed daily report.',`<button class="btn primary" id="emptyAddProd">Add job</button>`)}
 <div class="grid two" style="margin-top:16px"><div class="card"><div class="card-title">Exceptions</div><div style="margin-top:10px">${exceptionRows(jobs)}</div></div><div class="card"><div class="card-title">Daily Totals</div><div style="margin-top:10px">${summaryRows(s)}</div></div></div>`;
 $('#prodDate').onchange=e=>{dailyDate=e.target.value;renderDaily()};$('#addProdJob').onclick=()=>openJobModal();$('#emptyAddProd')&&($('#emptyAddProd').onclick=()=>openJobModal());$('#closeDay').onclick=()=>closeProductionDay(dailyDate);el.querySelectorAll('[data-job-edit]').forEach(b=>b.onclick=()=>openJobModal(b.dataset.jobEdit));}
function kpi(label,value,meta){return `<div class="card kpi-card"><div class="kpi-label">${esc(label)}</div><div class="kpi-value">${esc(value)}</div><div class="kpi-meta">${esc(meta)}</div></div>`}
function productionTable(jobs){return `<div class="table-wrap"><table class="table"><thead><tr><th>Job</th><th>Customer</th><th>Confirmed</th><th>Status</th><th>Change Order</th><th>Collected</th><th>Incomplete</th><th>Missing / Vendor</th><th></th></tr></thead><tbody>${jobs.map(j=>`<tr><td class="strong">${esc(j.jobNumber)}</td><td>${esc(j.customer)}</td><td class="money">${money(j.confirmedTotal)}</td><td>${statusChip(j.status||'Start',j.status==='Breakage/U2Day'?'bad':COMPLETED_STATUSES.has(j.status)?'good':j.status==='Deleted'?'gray':'warn')}</td><td class="money">${money(j.changeOrder)}</td><td class="money">${money(j.actualCollected)}</td><td class="money">${money(INCOMPLETE_AUTO.has(j.status)?(j.incomplete||j.confirmedTotal):j.incomplete)}</td><td>${j.missingItems?statusChip('Missing','warn'):''} ${j.vendorIssue?statusChip('Vendor','bad'):''}</td><td><button class="btn small" data-job-edit="${j.id}">Edit</button></td></tr>`).join('')}</tbody></table></div>`}
function exceptionRows(jobs){const x=jobs.filter(j=>j.status==='Breakage/U2Day'||j.missingItems||j.vendorIssue);return x.length?x.map(j=>`<div class="review-item"><div><b>#${esc(j.jobNumber)} • ${esc(j.customer)}</b><div class="meta">${esc(j.notes||j.missingItems||j.vendorIssue||'Exception')}</div></div>${statusChip(j.status==='Breakage/U2Day'?'Breakage':j.vendorIssue?'Vendor':'Missing',j.status==='Breakage/U2Day'||j.vendorIssue?'bad':'warn')}</div>`).join(''):`<div class="muted" style="font-size:11px">No exceptions recorded for this day.</div>`}
function summaryRows(s){const arr=[['Confirmed',money(s.confirmed)],['Collected',money(s.actual)],['Incomplete',money(s.incomplete)],['Breakage',money(s.breakage)],['Missing items',s.missing],['Vendor issues',s.vendor]];return arr.map(([a,b])=>`<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #eef2f4"><span class="muted">${a}</span><b>${b}</b></div>`).join('')}
function openJobModal(id){const j=id?state.productionJobs.find(x=>x.id===id):{id:'',date:dailyDate,status:'Start',changeOrder:0,actualCollected:0};openModal(id?'Edit Production Job':'Add Production Job',`<div class="form-grid"><div class="field"><label>Job #</label><input class="input" id="mJob" value="${esc(j.jobNumber||'')}"></div><div class="field"><label>Date</label><input class="input" id="mDate" type="date" value="${j.date||dailyDate}"></div><div class="field"><label>Customer</label><input class="input" id="mCustomer" value="${esc(j.customer||'')}"></div><div class="field"><label>Confirmed Job Total</label><input class="input" id="mConfirmed" type="number" step=".01" value="${Number(j.confirmedTotal||0)}"></div><div class="field"><label>Status</label><select class="select" id="mStatus">${PROD_STATUSES.map(x=>`<option ${x===j.status?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Change Order +/-</label><input class="input" id="mCO" type="number" step=".01" value="${Number(j.changeOrder||0)}"></div><div class="field"><label>Collected Revenue</label><input class="input" id="mActual" type="number" step=".01" value="${Number(j.actualCollected||0)}"></div><div class="field"><label>Incomplete $</label><input class="input" id="mIncomplete" type="number" step=".01" value="${Number(j.incomplete||0)}"></div><div class="field" style="grid-column:1/-1"><label>Installers</label><input class="input" id="mInstallers" value="${esc(j.installers||'')}"></div><div class="field"><label>Missing Items</label><input class="input" id="mMissing" value="${esc(j.missingItems||'')}"></div><div class="field"><label>Vendor Error / Near Miss</label><input class="input" id="mVendor" value="${esc(j.vendorIssue||'')}"></div><div class="field" style="grid-column:1/-1"><label>Notes</label><textarea class="textarea" id="mNotes">${esc(j.notes||'')}</textarea></div></div>`,`<button class="btn" id="modalCancel">Cancel</button>${id?'<button class="btn danger" id="dele function renderEmployeeManagement(el){let rows=state.employees.map(e=>({e,s:calloutStats(e),status:employmentStatusAt(e),snap:employeeSnapshot(e,asOf())}));const activeNow=rows.filter(x=>employeeActiveOn(x.e,asOf())),actions=activeNow.filter(x=>x.s.points>0),at5=activeNow.filter(x=>x.s.grace===5&&x.s.points===0),future=rows.filter(x=>x.status==='Not Yet Hired');if(employeeRosterFilter==='active')rows=activeNow;else if(employeeRosterFilter==='attention')rows=activeNow.filter(x=>x.s.points>0||x.s.grace===5);else if(employeeRosterFilter==='terminated')rows=rows.filter(x=>x.status==='Terminated'||x.status==='Inactive');else if(employeeRosterFilter==='future')rows=future;if(employeeRosterSearch){const q=employeeRosterSearch.toLowerCase();rows=rows.filter(x=>`${x.e.name} ${x.snap.role} ${x.snap.team||''}`.toLowerCase().includes(q))}rows.sort((a,b)=>(b.s.points-a.s.points)||(b.s.total-a.s.total)||a.e.name.localeCompare(b.e.name));el.innerHTML=`${actions.length?`<div class="action-banner"><div class="action-copy"><div class="action-title">Corrective action required — ${actions.length}</div><div class="action-detail">${actions.map(x=>`${x.e.name}: ${x.s.action}`).join(' • ')}</div></div></div>`:''}<div class="grid kpi">${kpi('Active Employees',activeNow.length,`As of ${fmtDate(asOf())}`)}${kpi('Corrective Actions',actions.length,'Needs manager action')}${kpi('At 5-Call-Out Limit',at5.length,'Next PTO-available call out = Verbal')}${kpi('Future Hires',future.length,'Automatically activate on hire date')}</div><div class="employee-tools"><div class="field"><label>Roster View</label><select class="select" id="employeeFilter"><option value="active" ${employeeRosterFilter==='active'?'selected':''}>Active</option><option value="attention" ${employeeRosterFilter==='attention'?'selected':''}>Needs Attention</option><option value="terminated" ${employeeRosterFilter==='terminated'?'selected':''}>Terminated / Inactive</option><option value="future" ${employeeRosterFilter==='future'?'selected':''}>Future Hires</option><option value="all" ${employeeRosterFilter==='all'?'selected':''}>All Employees</option></select></div><div class="field" style="min-width:260px"><label>Search</label><input class="input" id="employeeSearch" placeholder="Name, role, or team" value="${esc(employeeRosterSearch)}"></div></div><div class="table-wrap"><table class="table"><thead><tr><th>Employee</th><th>Role / Team</th><th>Hire Date</th><th>Termination</th><th>Status</th><th>Pay Profile</th><th>Call Outs</th><th>Corrective Action</th><th>Next Trigger</th><th></th></tr></thead><tbody>${rows.map(x=>`<tr class="${x.s.points?'employee-row-action':x.s.grace===5?'employee-row-watch':''}"><td><div class="employee-name"><b>${esc(x.e.name)}</b>${x.e.notes?`<small>${esc(x.e.notes)}</small>`:''}</div></td><td>${esc(x.snap.role||'—')}${x.snap.team?`<div class="muted" style="font-size:9px">Team ${esc(x.snap.team)}</div>`:''}</td><td class="nowrap">${fmtDate(x.e.hireDate)}</td><td class="nowrap">${x.e.terminationDate?fmtDate(x.e.terminationDate):'—'}</td><td>${statusChip(x.status,employeeStatusTone(x.e))}</td><td><div class="mini-pay">${x.snap.commissionRate!==''?`${num(x.snap.commissionRate,2)}% commission`:'—'}${x.snap.hourlyRate!==''?`<br>${money(x.snap.hourlyRate)}/hr`:''}</div></td><td class="center strong">${employeeActiveOn(x.e,asOf())?x.s.total:'—'}</td><td>${employeeActiveOn(x.e,asOf())?statusChip(x.s.action,x.s.points?'bad':x.s.grace===5?'warn':'good'):'—'}</td><td>${employeeActiveOn(x.e,asOf())?esc(x.s.next):'—'}</td><td class="nowrap"><button class="btn small" data-employee-view="${esc(x.e.name)}">View</button><button class="btn small" data-employee-edit="${x.e.id}" style="margin-left:4px">Edit</button></td></tr>`).join('')||`<tr><td colspan="10" class="muted">No employees match this view.</td></tr>`}</tbody></table></div><div class="rule-box" style="margin-top:12px"><b>Effective-dated roster:</b> role, team, commission %, and hourly rate come from Employment & Pay History for the date being reported. Hire and termination dates control whether the employee belongs in that report. Historical records are never deleted when an employee terminates or is promoted.</div>`;$('#employeeFilter').onchange=e=>{employeeRosterFilter=e.target.value;renderPayroll()};$('#employeeSearch').oninput=e=>{employeeRosterSearch=e.target.value;renderEmployeeManagement(el)};el.querySelectorAll('[data-employee-view]').forEach(b=>b.onclick=()=>openEmployeeDetail(b.dataset.employeeView));el.querySelectorAll('[data-employee-edit]').forEach(b=>b.onclick=()=>openEmployeeModal(b.dataset.employeeEdit))}

// ---------- Grading Surveys ----------
function renderSurveys(){const el=$('#view-surveys');const latest=surveyLatest(),ws=surveyWeekStats(latest);el.innerHTML=pageHead('Grading Surveys','Weekly PHL Lead/Master Lead accountability with the established leave exemption and effective-date rules preserved.',`<button class="btn" onclick="exportSection('surveys')">Export Excel</button><button class="btn primary" onclick="navigate('imports')">Import Survey Data</button>`)+`<div class="rule-box"><b>Locked rule:</b> ${esc(SURVEY_RULE)}</div><div class="grid kpi" style="margin-top:14px">${kpi('Week Ending',latest?fmtDate(latest.weekEnd):'—','Latest completed assessed week')}${kpi('Completed',ws.met,`${ws.eligible} accountable / excused`) }${kpi('Missed',ws.missed,'Requires attention')}${kpi('Excused',ws.excused,'3+ qualifying weekdays off / FMLA')}</div><div class="tabs" style="margin-top:16px"><button class="tab ${surveyTab==='current'?'active':''}" data-survey-tab="current">Current Week</button><button class="tab ${surveyTab==='summary'?'active':''}" data-survey-tab="summary">Lead Summary</button><button class="tab ${surveyTab==='weekly'?'active':''}" data-survey-tab="weekly">Weekly History</button></div><div id="surveyBody"></div>`;el.querySelectorAll('[data-survey-tab]').forEach(b=>b.onclick=()=>{surveyTab=b.dataset.surveyTab;renderSurveys()});const b=$('#surveyBody');if(surveyTab==='current'){if(!latest)b.innerHTML=empty('No survey data','Import the grading survey tracker/export.');else{const rows=[];for(const[k,v]of Object.entries(latest)){if(k==='weekStart'||k==='weekEnd')continue;const emp=employeeByName(k);if(emp&&!employeeActiveOn(emp,latest.weekEnd))continue;let status='Complete',tone='good';if(v==='EXC'||v==='FMLA'){status=v==='FMLA'?'FMLA':'Excused';tone='warn'}else if(v==='N/A'){status='Not accountable';tone='gray'}else if(Number(v)===0){status='Missed';tone='bad'}rows.push({name:k,count:v,status,tone})}b.innerHTML=`<div class="table-wrap"><table class="table"><thead><tr><th>Lead</th><th>Survey Count</th><th>Status</th></tr></thead><tbody>${rows.map(x=>`<tr><td class="strong">${esc(x.name)}</td><td>${esc(x.count)}</td><td>${statusChip(x.status,x.tone)}</td></tr>`).join('')}</tbody></table></div>`}}else if(surveyTab==='summary'){b.innerHTML=`<div class="table-wrap"><table class="table"><thead><tr><th>Team</th><th>Lead</th><th>Surveys</th><th>Required Weeks</th><th>Weeks Met</th><th>Missed</th><th>Compliance</th><th>Excused</th><th>Notes</th></tr></thead><tbody>${state.surveySummary.filter(x=>{const e=employeeByName(x.name);return !e||employeeActiveOn(e,asOf())}).map(x=>`<tr><td>${esc(x.team)}</td><td class="strong">${esc(x.name)}</td><td>${x.totalSurveys}</td><td>${x.requiredWeeks}</td><td>${x.weeksMet}</td><td>${x.missedWeeks}</td><td>${statusChip(pct(x.compliance,0),x.compliance>=.9?'good':x.compliance>=.8?'warn':'bad')}</td><td>${x.excusedWeeks}</td><td>${esc(x.notes)}</td></tr>`).join('')}</tbody></table></div>`}else{const rows=state.surveyWeekly.filter(x=>x.weekEnd<=asOf()).slice(-12).reverse();b.innerHTML=`<div class="table-wrap"><table class="table"><thead><tr><th>Week</th><th>Met</th><th>Missed</th><th>Excused</th><th>Eligible</th></tr></thead><tbody>${rows.map(r=>{const s=surveyWeekStats(r);return`<tr><td>${fmtDate(r.weekStart)} – ${fmtDate(r.weekEnd)}</td><td>${s.met}</td><td>${statusChip(s.missed,s.missed?'bad':'good')}</td><td>${s.excused}</td><td>${s.eligible}</td></tr>`}).join('')}</tbody></table></div>`}}

// ---------- WBR ----------
function renderWBR(){const el=$('#view-wbr');const wf=latestImport('production-workflow'),rt=latestImport('regional-tracker');el.innerHTML=pageHead('WBR','Bath-only weekly business review. Current/previous rows, WTD/MTD completed logic, workflow status grouping, and backlog rules remain isolated from other modules.',`<button class="btn" onclick="exportSection('wbr')">Export Excel</button><button class="btn primary" onclick="navigate('imports')">Import WBR Sources</button>`)+`<div class="grid kpi">${kpi('Regional Tracker',rt?'Loaded':'Needed',rt?rt.fileName:'Confirmed / Completed source')}${kpi('Production Workflow',wf?'Loaded':'Needed',wf?wf.fileName:'Start / Scheduled / Ordered + backlog')}${kpi('Current Bath WBR',state.wbrData?.current?'Ready':'Waiting','No numbers are invented without both sources')}${kpi('Export','Planned','Populate existing WBR format')}</div><div style="margin-top:15px">${state.wbrData?.current?genericImportedTable([state.wbrData.current],'',''):empty('WBR needs its two source reports','Import the Regional Tracker and full PHL Production Workflow. The established Bath WBR logic will remain separate and will not reuse Daily Production totals unless the rule explicitly calls for them.')}</div>`}

// ---------- REQ ----------
function renderREQ(){const el=$('#view-req');const imp=latestImport('assigned-jobs'),reportDate=imp?.dateThrough||asOf();const rows=state.reqRecords.filter(x=>{const e=employeeByName(x.Name);return !e||employeeActiveOn(e,reportDate)}).slice().sort((a,b)=>Number(b['REQ Score']||0)-Number(a['REQ Score']||0));const avg=rows.length?rows.reduce((a,x)=>a+Number(x['REQ Score']||0),0)/rows.length:0;const top=rows[0];el.innerHTML=pageHead('REQ','Employee REQ scoring remains completely separate from Payroll. Assignment credit rules are preserved exactly.',`<button class="btn" onclick="exportSection('req')">Export Excel</button><button class="btn primary" onclick="navigate('imports')">Import Assigned Jobs</button>`)+`<div class="rule-box"><b>Locked REQ rules:</b> If the employee is assigned to the job, give full generated revenue credit regardless of working hours. Multiple assigned Leads/Apprentices each receive the full generated revenue amount; no split reduction. The reporting date window is based on assigned jobs, not payroll completion logic.</div><div class="grid kpi" style="margin-top:14px">${kpi('Assigned Job Report',imp?'Loaded':'Needed',imp?imp.fileName:'Required for REQ')}${kpi('Employees Scored',rows.length,'Current imported period')}${kpi('Average REQ',rows.length?num(avg,2):'—','Revenue + Efficiency + Quality')}${kpi('Top REQ',top?num(top['REQ Score'],2):'—',top?top.Name:'No data')}</div><div style="margin-top:15px">${rows.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Rank</th><th>Employee</th><th>Role</th><th>Generated</th><th>Capacity</th><th>Revenue</th><th>Efficiency</th><th>Quality</th><th>REQ</th></tr></thead><tbody>${rows.map((x,i)=>`<tr><td>${i+1}</td><td class="strong">${esc(x.Name)}</td><td>${esc(employeeSnapshot(employeeByName(x.Name),reportDate).role||x.Role)}</td><td class="money">${money(x.Generated)}</td><td class="money">${money(x.Capacity)}</td><td>${num(x['Revenue Score'],2)}</td><td>${num(x['Efficiency Score'],2)}</td><td>${num(x['Quality Score'],2)}</td><td>${statusChip(num(x['REQ Score'],2),Number(x['REQ Score'])>=3?'good':Number(x['REQ Score'])>=2.8?'warn':'bad')}</td></tr>`).join('')}</tbody></table></div>`:empty('REQ is waiting for an assigned-job report','Import the same assigned-job source you use for the REQ automator. The module will not substitute payroll working-hour rules.')}</div>`}

// ---------- Excel-compatible exports ----------
function excelXmlEscape(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function normalizeExportRows(rows){if(!Array.isArray(rows))return[];return rows.map(r=>{if(r==null)return{};if(Array.isArray(r))return Object.fromEntries(r.map((v,i)=>[`Column ${i+1}`,v]));return r})}
function workbookXml(sheets){const ws=sheets.filter(s=>s&&s.rows).map(s=>{const rows=normalizeExportRows(s.rows);const headers=s.headers||[...new Set(rows.flatMap(r=>Object.keys(r)))];const rowXml=[headers.map(h=>`<Cell ss:StyleID="Header"><Data ss:Type="String">${excelXmlEscape(h)}</Data></Cell>`).join(''),...rows.map(r=>headers.map(h=>{const v=r[h];const isNum=typeof v==='number'&&Number.isFinite(v);return `<Cell><Data ss:Type="${isNum?'Number':'String'}">${excelXmlEscape(v??'')}</Data></Cell>`}).join(''))].map(c=>`<Row>${c}</Row>`).join('');return `<Worksheet ss:Name="${excelXmlEscape(String(s.name||'Sheet').slice(0,31))}"><Table>${rowXml}</Table><WorksheetOptions xmlns="urn:schemas-microsoft-com:office:excel"><FreezePanes/><FrozenNoSplit/><SplitHorizontal>1</SplitHorizontal><TopRowBottomPane>1</TopRowBottomPane><ActivePane>2</ActivePane></WorksheetOptions></Worksheet>`}).join('');return `<?xml version="1.0"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns:o="urn:schemas-microsoft-com:office:office"><Styles><Style ss:ID="Default" ss:Name="Normal"><Alignment ss:Vertical="Bottom"/><Font ss:FontName="Arial" ss:Size="10"/></Style><Style ss:ID="Header"><Font ss:FontName="Arial" ss:Size="10" ss:Bold="1"/><Interior ss:Color="#DCEFFA" ss:Pattern="Solid"/></Style></Styles>${ws}</Workbook>`}
function downloadExcel(filename,sheets,entity='Export'){const xml=workbookXml(sheets);const blob=new Blob([xml],{type:'application/vnd.ms-excel;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename.endsWith('.xls')?filename:`${filename}.xls`;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(a.href);audit('Excel export',entity,a.download);toast('Excel export downloaded')}
function employeeExportRows(ref=asOf()){return state.employees.map(e=>{const s=employeeSnapshot(e,ref),c=calloutStats(e);return{Employee:e.name,Role:s.role,Team:s.team,'Hire Date':e.hireDate,'Termination Date':e.terminationDate||'',Status:employmentStatusAt(e,ref),'Commission %':s.commissionRate,'Hourly Rate':s.hourlyRate,'Active Call Outs':employeeActiveOn(e,ref)?c.total:'','Corrective Action':employeeActiveOn(e,ref)?c.action:'','Next Trigger':employeeActiveOn(e,ref)?c.next:'',Notes:e.notes||''}})}
function auditExportSheets(){return[{name:'Audit History',rows:state.audit.map(a=>({Timestamp:a.ts,Action:a.action,Entity:a.entity,Details:a.details}))},{name:'Import History',rows:state.imports.map(i=>({'Imported At':i.importedAt,'Report Type':i.type||i.reportType||'',File:i.fileName||'', 'Date Through':i.dateThrough||'',Status:i.status||''}))},{name:'Employment History',rows:employmentHistoryFlat()},{name:'Call Out History',rows:state.callouts.map(c=>({Employee:c.employee,Date:c.date,'PTO Available':c.ptoAvailable===false?'No':'Yes',Source:c.source||'',Notes:c.notes||''}))}]}
function exportSection(section){const stamp=todayISO();if(section==='home'){const latest=surveyLatest(),ss=surveyWeekStats(latest),pdate=latestProdDate(),ps=prodStats(pdate),co=activeEmployees(asOf()).map(e=>({e,s:calloutStats(e)})),acts=co.filter(x=>x.s.points>0);downloadExcel(`Bath_Manager_Home_${stamp}`,[{name:'Manager Snapshot',rows:[{Metric:'As Of',Value:asOf()},{Metric:'Active Employees',Value:activeEmployees(asOf()).length},{Metric:'Corrective Actions',Value:acts.length},{Metric:'Latest Production Date',Value:pdate},{Metric:'Confirmed Revenue',Value:ps.confirmed},{Metric:'Collected Revenue',Value:ps.actual},{Metric:'Breakage Jobs',Value:ps.breakageJobs},{Metric:'Survey Week Ending',Value:latest?.weekEnd||''},{Metric:'Survey Misses',Value:ss.missed},{Metric:'Pending Import Review',Value:state.reviewQueue.filter(x=>x.status==='pending').length}]},{name:'People Attention',rows:acts.map(x=>({Employee:x.e.name,'Call Outs':x.s.total,'Corrective Action':x.s.action,'Next Trigger':x.s.next}))}],'Home');return}
 if(section==='imports'){downloadExcel(`Bath_Imports_${stamp}`,[{name:'Import History',rows:state.imports},{name:'Review Queue',rows:state.reviewQueue}],'Imports');return}
 if(section==='daily'){const d=dailyDate||latestProdDate()||asOf(),s=prodStats(d);downloadExcel(`Bath_Daily_Production_${d}`,[{name:'Daily Summary',rows:[{Date:d,'Expected Jobs':s.expectedJobs,'Completed Jobs':s.completed,'Confirmed Revenue':s.confirmed,'Collected Revenue':s.actual,'Incomplete Revenue':s.incomplete,'Breakage Jobs':s.breakageJobs,'Breakage Revenue':s.breakage,'Missing Items':s.missing,'Vendor Issues':s.vendor,'Success Rate':s.successRate}]},{name:'Jobs',rows:state.productionJobs.filter(j=>j.date===d)}],'Daily Production');return}
 if(section==='capacity'){downloadExcel(`Bath_Capacity_${stamp}`,[{name:'Historical Capacity',rows:state.capacityHistory},{name:'Future Workflow',rows:state.workflowRows}],'Capacity');return}
 if(section==='scheduling'){downloadExcel(`Bath_Advanced_Scheduling_${stamp}`,[{name:'Move Up Customers',rows:state.moveUps},{name:'Ready Unscheduled',rows:state.schedulingOpportunities},{name:'Permits',rows:state.permits},{name:'Dead Stock',rows:state.deadStock}],'Advanced Scheduling');return}
 if(section==='payroll'){downloadExcel(`Bath_Employees_Payroll_Audit_${stamp}`,[{name:'Employee Master',rows:employeeExportRows(asOf())},{name:'Employment History',rows:employmentHistoryFlat()},{name:'Call Out History',rows:state.callouts.map(c=>({Employee:c.employee,Date:c.date,'PTO Available':c.ptoAvailable===false?'No':'Yes',Source:c.source||'',Notes:c.notes||''}))},{name:'Payroll Imports',rows:state.imports.filter(i=>['tech-timesheet','payroll-roster'].includes(i.type||i.reportType))}],'Payroll / Employees');return}
 if(section==='surveys'){downloadExcel(`Bath_Grading_Surveys_${stamp}`,[{name:'Lead Summary',rows:state.surveySummary},{name:'Weekly History',rows:state.surveyWeekly}],'Grading Surveys');return}
 if(section==='wbr'){const current=state.wbrData?.current?[state.wbrData.current]:[];downloadExcel(`Bath_WBR_${stamp}`,[{name:'WBR Current',rows:current},{name:'Workflow Source',rows:state.workflowRows}],'WBR');return}
 if(section==='req'){downloadExcel(`Bath_REQ_${stamp}`,[{name:'REQ Scorecard',rows:state.reqRecords}],'REQ');return}
 if(section==='audit'){downloadExcel(`Bath_Audit_History_${stamp}`,auditExportSheets(),'Audit');return}
}

// ---------- Audit / Admin ----------
function renderAudit(){const el=$('#view-audit');el.innerHTML=pageHead('Audit & Administration','Every important manual change and import is recorded here. Excel exports are for human-readable audit/review; JSON Backup is the full restorable database.',`<button class="btn" id="restoreBtn">Restore Backup</button><button class="btn" id="auditExcelBtn">Export Audit Excel</button><button class="btn primary" id="backupBtn">Export JSON Backup</button>`)+`<div class="grid kpi">${kpi('Audit Entries',state.audit.length,'Newest first')}${kpi('Imports',state.imports.length,'Report history')}${kpi('Employees',activeEmployees(asOf()).length,`${state.employees.length} total roster records`)}${kpi('Employment Changes',employmentHistoryFlat().length,'Effective-dated history')}</div><div class="grid two" style="margin-top:15px"><div><div class="section-title">Audit History</div>${auditTable()}</div><div><div class="section-title">Administration</div><div class="card"><div class="card-title">Employee Master</div><p class="muted" style="font-size:11px;line-height:1.5">The shared roster now stores effective-dated role, team, commission, and hourly-rate history. Add new hires once; promotions and pay changes are appended rather than overwriting history.</p><button class="btn" id="auditAddEmployee">Add New Hire</button><button class="btn" style="margin-left:6px" id="openCallouts">Open Employee Management</button><div class="section-title">Exports & Data Safety</div><div class="rule-box"><b>Export Audit Excel</b> creates an Excel-compatible workbook with Audit History, Import History, Employment History, and Call Out History.<br><br><b>Export JSON Backup</b> is the full restorable local database and should still be used before moving devices or deploying a replacement version.</div></div></div></div>`;$('#backupBtn').onclick=exportBackup;$('#globalBackup').onclick=exportBackup;$('#auditExcelBtn').onclick=()=>exportSection('audit');$('#restoreBtn').onclick=()=>$('#restoreInput').click();$('#auditAddEmployee').onclick=()=>openEmployeeModal();$('#openCallouts').onclick=()=>{payrollTab='employees';employeeRosterFilter='active';navigate('payroll')}}

function auditTable(){return `<div class="table-wrap"><table class="table"><thead><tr><th>Time</th><th>Action</th><th>Entity</th><th>Details</th></tr></thead><tbody>${state.audit.slice(0,250).map(a=>`<tr><td class="nowrap">${new Date(a.ts).toLocaleString()}</td><td class="strong">${esc(a.action)}</td><td>${esc(a.entity)}</td><td>${esc(a.details)}</td></tr>`).join('')}</tbody></table></div>`}
function exportBackup(){const blob=new Blob([JSON.stringify({app:'Bath Manager Dashboard',version:SEED.version,exportedAt:new Date().toISOString(),state},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`Bath_Manager_Dashboard_Backup_${todayISO()}.json`;a.click();URL.revokeObjectURL(a.href);audit('Backup exported','Database',a.download);toast('Backup exported')}
async function restoreBackup(file){try{const d=JSON.parse(await file.text());if(!d.state)throw Error('Not a dashboard backup');state=d.state;ensureShape();audit('Backup restored','Database',file.name);await dbSet('state',state);toast('Backup restored');renderAll()}catch(e){toast('Backup could not be restored')}}

// ---------- Init ----------
function bindGlobal(){buildNav();$('#modalClose').onclick=closeModal;$('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()};$('#mobileMenu').onclick=()=>$('#sidebar').classList.toggle('open');$('#globalBackup').onclick=exportBackup;$('#restoreInput').onchange=e=>e.target.files[0]&&restoreBackup(e.target.files[0]);document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g)navigate(g.dataset.go)})}
async function init(){await loadState();state.settings=state.settings||{asOf:'2026-11-18'};if(!state.settings.asOf)state.settings.asOf='2026-11-18';bindGlobal();navigate('home')}
init().catch(e=>{document.body.innerHTML=`<pre style="padding:20px">Dashboard failed to start: ${esc(e.stack||e)}</pre>`});
</script>
